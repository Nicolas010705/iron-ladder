<title>Iron Ladder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: App-Shell, Seitenleiste (Desktop) / Tabbar (Handy). Ein mutiges Element: der blaue Trainingsblock auf „Heute“.
   Farben = Wettkampf-Hantelscheiben: Blau 20 kg (Aktion), Gelb 15 kg (Fett, Hinweise), Grün 10 kg (erledigt), Rot 25 kg (Warnung).
   Schrift: Barlow Condensed (Anzeige, wie Anzeigetafeln im Kraftsport) + Barlow (Text). Skala 14/16/20/24/32/Display. */
:root{
  --bg:#eceef2; --surface:#fbfbfd; --surface-2:#e0e4ea; --row:#f0f2f6; --line:#cfd5de; --fg:#0d1117; --muted:#4a5462;
  --plate-blue:#1d5bd6; --plate-yellow:#f2b705; --plate-green:#1d8a4e; --plate-red:#d42f3c;
  --accent:#1d5bd6; --accent-ink:#ffffff; --accent-soft:#dce6f8; --accent-text:#174bb3;
  --hero:#1d5bd6; --on-hero:#ffffff; --on-hero-muted:#d6e2fa; --hero-row:#164db8; --hero-off:#4b7ee0;
  --teal:#1d8a4e; --teal-soft:#dbefe3; --good:#1d8a4e; --warn:#c99700; --bad:#d42f3c; --yellow-soft:#fbefc7;
  --map-off:#cfd5de; --fig:#2c3440;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px; --r-sm:6px; --ease:cubic-bezier(.2,.7,.2,1); --tap:44px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10141b; --surface:#181d26; --surface-2:#252c37; --row:#1d232d; --line:#2e3642; --fg:#f0f3f7; --muted:#a3adbb;
  --accent:#5b8ff5; --accent-ink:#071634; --accent-soft:#1b2c4d; --accent-text:#9dbcff;
  --hero:#1d5bd6; --on-hero:#ffffff; --on-hero-muted:#d6e2fa; --hero-row:#164db8; --hero-off:#4b7ee0;
  --teal:#45c07c; --teal-soft:#15301f; --good:#45c07c; --warn:#f2b705; --bad:#ff6b76; --yellow-soft:#3a3115;
  --map-off:#2c333e; --fig:#c9d1de; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#181d26; --surface-2:#252c37; --row:#1d232d; --line:#2e3642; --fg:#f0f3f7; --muted:#a3adbb;
  --accent:#5b8ff5; --accent-ink:#071634; --accent-soft:#1b2c4d; --accent-text:#9dbcff;
  --hero:#1d5bd6; --on-hero:#ffffff; --on-hero-muted:#d6e2fa; --hero-row:#164db8; --hero-off:#4b7ee0;
  --teal:#45c07c; --teal-soft:#15301f; --good:#45c07c; --warn:#f2b705; --bad:#ff6b76; --yellow-soft:#3a3115;
  --map-off:#2c333e; --fig:#c9d1de; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:0;line-height:1.1}
h1{font-size:2rem}
h2{font-size:1.5rem}
h3{font-size:1.25rem}
p{margin:0}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.lbl{font-size:.875rem;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100dvh;padding:22px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand b{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1;text-transform:uppercase}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-sm);color:var(--muted);font-weight:600;transition:background-color .16s,color .16s}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--row);color:var(--fg)}
.nav button:active{transform:scale(.98)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:8px}
.sync{font-size:.875rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)}
.main{min-width:0;padding-block:30px 56px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wrap p{max-width:65ch}
@media (min-width:861px){.main{padding-left:max(36px, env(safe-area-inset-left, 0px));padding-right:max(36px, env(safe-area-inset-right, 0px))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:30;flex-direction:row;
    padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
  .brand,.side .foot{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav button{flex-direction:column;gap:3px;font-size:.75rem;padding:7px 2px;flex:1;align-items:center}
  .main{padding-block:20px 116px}
  h1{font-size:1.75rem}
}

/* Flächen */
.card{background:var(--surface);border-radius:var(--r);padding:20px;min-width:0}
.card.flat{background:var(--row)}
.card .card,.sheet .card,.hero-card .card{background:var(--row)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:960px){.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.g2{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:6px}

.btn{all:unset;box-sizing:border-box;cursor:pointer;min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--r-sm);font-weight:600;background:var(--surface-2);color:var(--fg);text-align:center;line-height:1.2;transition:background-color .16s,transform .12s,filter .16s}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{background:var(--line)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:1.25rem;letter-spacing:.01em;padding:9px 20px}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:8px 12px;font-size:.875rem;min-height:40px}
.btn.sm svg{width:15px;height:15px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{all:unset;cursor:pointer;width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:var(--r-sm);color:var(--muted);transition:background-color .16s,color .16s}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:19px;height:19px}

.chip{all:unset;cursor:pointer;min-height:40px;box-sizing:border-box;display:inline-flex;align-items:center;padding:8px 14px;border-radius:999px;background:var(--surface-2);font-size:.875rem;font-weight:600;color:var(--muted);white-space:nowrap;transition:background-color .16s,color .16s}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--r-sm);font-size:.875rem;font-weight:600;background:var(--surface-2);color:var(--fg)}
.tag svg{width:13px;height:13px}
.tag.p{background:var(--accent-soft);color:var(--accent-text)}
.tag.t{background:var(--teal-soft);color:var(--teal)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.875rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=search],input[type=date],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-width:0;font-size:1rem}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transform-origin:left center}

/* Onboarding */
.ob{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.ob-hero{display:flex;gap:18px;align-items:center}
.ob-hero h1{font-size:clamp(3rem,7vw,5rem);font-weight:700;line-height:.9;text-transform:uppercase}
.step-txt{font-size:.875rem;color:var(--muted);font-weight:600}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;padding:15px;border-radius:var(--r);background:var(--row);display:flex;flex-direction:column;gap:4px;min-width:0;transition:background-color .16s,transform .12s}
.opt:hover{background:var(--surface-2)}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{background:var(--accent-soft);outline:2px solid var(--accent);outline-offset:-2px}
.opt b{font-family:var(--f-display);font-size:1rem;font-weight:600}
.opt span{font-size:1rem;color:var(--muted)}
.daypick{display:flex;gap:8px;flex-wrap:wrap}
.daypick button{all:unset;cursor:pointer;width:60px;height:60px;border-radius:var(--r);background:var(--row);display:grid;place-items:center;font-family:var(--f-display);font-size:2rem;font-weight:600;transition:background-color .16s,transform .12s}
.daypick button:hover{background:var(--surface-2)}
.daypick button:active{transform:scale(.96)}
.daypick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.badge-rec{align-self:flex-start;font-size:.875rem;font-weight:600;color:var(--good)}

/* Heute */
.hero-card{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;background:var(--hero);color:var(--on-hero);border-radius:14px;padding:32px;overflow:hidden}
.hero-card h3{color:var(--on-hero)}
.hero-card .btn.pri{background:var(--on-hero);color:var(--hero)}
.hero-card .btn.pri:hover{background:var(--on-hero);filter:brightness(.95)}
.hero-card .btn.ghost{color:var(--on-hero)}
.hero-card .btn.ghost:hover{background:var(--hero-row)}
.hero-card :focus-visible{outline-color:var(--on-hero)}
@media (max-width:960px){.hero-card{grid-template-columns:minmax(0,1fr);padding:22px;gap:22px}}
.hero-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.big{font-family:var(--f-display);font-size:clamp(3.5rem,8vw,7.5rem);font-weight:700;line-height:.84;letter-spacing:-.01em;text-transform:uppercase;hyphens:auto;overflow-wrap:break-word;margin-left:-.04em}
.hero-main .sub{color:var(--on-hero-muted)}
.hero-main .row{margin-top:auto;padding-top:6px}
.goal-list{display:flex;flex-direction:column;gap:4px;margin:10px 0 0;padding:0;list-style:none}
.goal-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:11px 14px;border-radius:var(--r-sm);background:var(--hero-row);align-items:baseline}
.goal-list li small{display:block;color:var(--on-hero-muted);font-size:.875rem}
.goal-list li b{font-size:1.25rem}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--row)}
.kpi .v{font-family:var(--f-display);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
.tip{background:var(--teal-soft);border-radius:var(--r);padding:22px 24px;display:flex;flex-direction:column;gap:8px}
.tip h3{font-size:1.25rem}
.tip .src{font-size:.875rem;color:var(--muted)}
.linkcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:background-color .16s,transform .12s}
.linkcard:hover{background:var(--row)}
.linkcard:active{transform:scale(.99)}

.home-head{flex-wrap:nowrap;align-items:flex-start}
.home-head .lv{color:var(--accent-text)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.875rem;color:var(--muted)}
.week i{width:100%;aspect-ratio:1;border-radius:var(--r-sm);background:var(--surface-2)}
.week .done i{background:var(--plate-yellow)}
.week .today{color:var(--fg);font-weight:600}
.week .today i{outline:2px solid var(--fg);outline-offset:1px}
.streak{background:var(--yellow-soft)}
.hero-facts{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:20px;align-items:center;margin-top:6px}
.hero-map svg{width:100%;height:auto;display:block}
.hero-facts dl{margin:0;display:flex;flex-direction:column;gap:12px}
.hero-facts dt{font-size:.875rem;color:var(--on-hero-muted);font-weight:600}
.hero-facts dd{margin:0;font-size:1.5rem;font-weight:600;font-family:var(--f-display);line-height:1.15}
@media (max-width:420px){.hero-facts{grid-template-columns:120px minmax(0,1fr);gap:14px}.hero-facts dd{font-size:1rem}}
/* Ränge */
.rank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.rank{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.rank .tier{font-family:var(--f-display);font-weight:600;font-size:1.25rem}
.rank .sr{font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.emb{display:block}
.overall{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.maps{display:flex;gap:10px;justify-content:center}
.maps svg{width:100%;max-width:280px;height:auto}

/* Training */
.ex-card{display:flex;flex-direction:column;gap:14px}
.ex-top{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center}
.thumb{width:64px;height:64px;border-radius:var(--r-sm);background:var(--row);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:100%;height:100%}
.sugg{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r-sm);padding:12px 14px;font-size:1rem}
.sugg svg{flex:none;width:18px;height:18px;color:var(--accent-text);margin-top:2px}
.sugg b{color:var(--accent-text)}
.sets{width:100%;border-collapse:separate;border-spacing:0 4px;font-variant-numeric:tabular-nums}
.sets th{font-size:.875rem;color:var(--muted);font-weight:600;text-align:left;padding:2px 4px}
.sets td{padding:3px 4px}
.sets input{padding:9px 6px;text-align:center}
.sets .prev{font-size:.875rem;color:var(--muted);white-space:nowrap}
.sets tr td{transition:background-color .2s}
.sets tr.done td{background:var(--teal-soft)}
.sets tr.done td:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.sets tr.done td:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.check{all:unset;cursor:pointer;width:var(--tap);height:var(--tap);border-radius:var(--r-sm);background:var(--surface-2);display:grid;place-items:center;transition:background-color .16s,transform .12s}
.check:active{transform:scale(.92)}
.check svg{width:18px;height:18px;opacity:.35}
tr.done .check{background:var(--teal);color:#fff}
tr.done .check svg{opacity:1}
.wo-head{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--bg);padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wo-head .timer{font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted);font-size:1.25rem}
.rest{position:fixed;z-index:35;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);border-radius:var(--r);padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)} /* taste-skill-ignore: schwebt über dem Inhalt */
.rest .t{font-family:var(--f-display);font-size:1.75rem;font-variant-numeric:tabular-nums;min-width:64px}
.rest button{all:unset;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;padding:6px 12px;border-radius:var(--r-sm);background:rgba(127,127,127,.25);font-weight:600;font-size:.875rem}
@media (max-width:860px){.rest{bottom:calc(86px + env(safe-area-inset-bottom, 0px))}}

/* Bibliothek */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.lib-item{all:unset;box-sizing:border-box;cursor:pointer;background:var(--row);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:background-color .16s,transform .12s}
.lib-item:hover{background:var(--surface-2)}
.lib-item:active{transform:scale(.98)}
.lib-item .pics{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border-radius:var(--r-sm);padding:6px;aspect-ratio:2/1;max-width:100%}
.lib-item .pics svg{width:100%;height:100%}
.lib-item b{font-size:1rem;line-height:1.25;font-weight:600}
.lib-item small{color:var(--muted);font-size:.875rem}

/* Ernährung */
.ring-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center}
@media (max-width:520px){.ring-wrap{grid-template-columns:minmax(0,1fr);justify-items:center}}
.macro{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:1rem}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 6px 8px 12px;border-radius:var(--r-sm);background:var(--row);margin-top:6px}
.entry small{color:var(--muted);display:block;font-size:.875rem}
.food-res{display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow:auto}
.food-res button{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--row);transition:background-color .16s}
.food-res button:hover{background:var(--surface-2)}
.food-res button[aria-pressed="true"]{background:var(--accent-soft)}
.food-res small{color:var(--muted);font-size:.875rem}
.off-box{display:flex;flex-direction:column;gap:12px;border-radius:var(--r);padding:14px;background:var(--row)}
.off-box .food-res button{background:var(--surface)}
.off-box .food-res button:hover{background:var(--surface-2)}
.off-box .food-res button[aria-pressed="true"]{background:var(--accent-soft)}
.off-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:end}
@media (max-width:620px){.off-form{grid-template-columns:minmax(0,1fr)}}
.off-note{font-size:.875rem;color:var(--muted);margin:0}
.off-err{font-size:1rem;color:var(--bad);margin:0}
.off-cta{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--teal-soft);color:var(--teal);font-weight:600;font-size:1rem;transition:filter .16s}
.off-cta:hover{filter:brightness(.97)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--surface);border-radius:12px;width:100%;max-width:620px;max-height:88vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
@media (max-width:620px){.overlay{align-items:flex-end;padding:0}.sheet{border-radius:14px 14px 0 0;max-height:92vh;padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}}
.toast{position:fixed;z-index:60;top:calc(14px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:var(--r);font-weight:600;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3)} /* taste-skill-ignore: schwebt */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--teal-soft);border-radius:var(--r);padding:12px 16px;font-size:1rem}
.chart-box{overflow-x:auto}
.chart-box svg{width:100%;min-width:320px;height:auto;display:block}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--row);border-radius:var(--r)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist details{background:var(--row);border-radius:var(--r-sm);padding:12px 14px}
.hist summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;list-style:none}
.hist summary::-webkit-details-marker{display:none}
.vol{display:grid;grid-template-columns:120px minmax(0,1fr) 42px;gap:10px;align-items:center;font-size:1rem}
.vol .track{position:relative;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.vol .zone{position:absolute;top:0;bottom:0;background:var(--teal-soft)}
.vol .fill{position:absolute;top:3px;bottom:3px;left:0;border-radius:4px;background:var(--accent);transform-origin:left center}
.rankup{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--r);background:var(--accent-soft)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fig-big{background:var(--row);border-radius:var(--r);display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.fig-big svg{width:100%;height:auto;max-height:220px}
.recent-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--row);flex-wrap:nowrap}

/* Bewegung: ein orchestrierter Moment je Ansicht statt Einblenden überall.
   Heute: Der Trainingsname wird wie eine Scheibe auf die Stange geschoben, die Ziele folgen.
   Ränge: Die Abzeichen klettern nacheinander. Sonst nur Bewegung als Antwort auf eine Aktion. */
@keyframes load{from{transform:translateX(-36px);opacity:.1}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:.1;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes climb{0%{transform:translateY(16px) scale(.85);opacity:.15}70%{transform:translateY(-3px) scale(1.05)}100%{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes fill{from{background:var(--surface-2)}}
.wrap.enter .big{animation:load .6s var(--ease) both}
.wrap.enter .goal-list li{animation:rise .45s var(--ease) both}
.wrap.enter .goal-list li:nth-child(1){animation-delay:.18s}.wrap.enter .goal-list li:nth-child(2){animation-delay:.24s}.wrap.enter .goal-list li:nth-child(3){animation-delay:.3s}.wrap.enter .goal-list li:nth-child(4){animation-delay:.36s}.wrap.enter .goal-list li:nth-child(5){animation-delay:.42s}
.wrap.enter .rank-grid>.card .emb,.wrap.enter .overall .emb{animation:climb .7s var(--ease) both}
.wrap.enter .rank-grid>.card:nth-child(2) .emb{animation-delay:.04s}.wrap.enter .rank-grid>.card:nth-child(3) .emb{animation-delay:.08s}.wrap.enter .rank-grid>.card:nth-child(4) .emb{animation-delay:.12s}.wrap.enter .rank-grid>.card:nth-child(5) .emb{animation-delay:.16s}.wrap.enter .rank-grid>.card:nth-child(6) .emb{animation-delay:.2s}.wrap.enter .rank-grid>.card:nth-child(7) .emb{animation-delay:.24s}.wrap.enter .rank-grid>.card:nth-child(n+8) .emb{animation-delay:.28s}
.sets tr.done td{animation:fill .25s ease-out}
.rankup .emb{animation:pop .7s ease-out both}
.sheet{animation:rise .24s var(--ease) both}
@media (prefers-reduced-motion: reduce){
  .wrap.enter *,.sheet,.rankup .emb,.sets tr.done td{animation:none!important}
  .spin{animation-duration:2.4s}
  .btn,.chip,.nav button,.opt,.lib-item,.check,.linkcard{transition:none}
}

];
const DIVS=['I','II','III'];
function tierOf(sr){
 let i=0; for(let k=0;k<TIERS.length;k++) if(sr>=TIERS[k].min) i=k;
 const t=TIERS[i], nx=TIERS[i+1];
 if(!nx) return {i,t,div:'',label:t.n,next:null,prog:1,toNext:0};
 const span=(nx.min-t.min)/3; const step=Math.min(2,Math.floor((sr-t.min)/span));
 const divNum=3-step; const lo=t.min+step*span, hi=lo+span;
 return {i,t,div:DIVS[divNum-1],divNum,label:`${t.n} ${DIVS[divNum-1]}`,prog:(sr-lo)/span,toNext:Math.ceil(hi-sr),nextLabel:divNum===1?`${nx.n} III`:`${t.n} ${DIVS[divNum-2]}`};
}
function emblem(sr,size=56){
 const r=tierOf(sr), t=r.t, i=r.i;
 const pips=r.divNum?4-r.divNum:0;
 let pipS=''; for(let k=0;k<pips;k++){const x=32+(k-(pips-1)/2)*9;pipS+=`<path d="M${x} 54l3 3-3 3-3-3z" fill="#fff" fill-opacity=".9"/>`}
 const glyph=i>=8?'<path d="M32 18l4 9 10 1-8 6 3 10-9-6-9 6 3-10-8-6 10-1z" fill="#fff" fill-opacity=".92"/>'
  :i>=5?'<path d="M32 17l11 11-11 17-11-17z" fill="#fff" fill-opacity=".85"/><path d="M21 28h22" stroke="'+t.c2+'" stroke-width="1.5"/>'
  :`<g stroke="#fff" stroke-opacity=".9" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">${Array.from({length:Math.min(3,i+1)},(_,k)=>`<path d="M23 ${38-k*7}l9-7 9 7"/>`).join('')}</g>`;
 return `<svg viewBox="0 0 64 72" width="${size}" height="${Math.round(size*72/64)}" class="emb" role="img" aria-label="${esc(r.label)}"><defs><linearGradient id="tg${i}" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="${t.c1}"/><stop offset="1" stop-color="${t.c2}"/></linearGradient></defs><path d="M32 3L59 15v31c0 13-12 20-27 24C17 66 5 59 5 46V15z" fill="url(#tg${i})" stroke="${t.c2}" stroke-width="2"/><path d="M32 10L52 19v26c0 9-8 15-20 18-12-3-20-9-20-18V19z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.4"/>${glyph}${pipS}</svg>`;
}

/* ============ Open Food Facts (live über den Browser der Claude-App) ============ */
const OFF_HOST='host:claude_browser';
const OFF_FIELDS='code,product_name,product_name_de,brands,quantity,serving_quantity,nutriments';
let MCP=null, OFFTAB=null;
const STANDALONE=!!window.IRON_STANDALONE;
const offAvailable=()=>STANDALONE||!!MCP;
const toolText=res=>{ const t=(res&&res.content||[]).filter(b=>b&&b.type==='text').map(b=>b.text).join('\n'); if(t) return t; const p=res&&res.payload; return typeof p==='string'?p:JSON.stringify(p||''); };
function offUrl(brand,q){
 const clean=s=>s.replace(/["\\:()\[\]{}^~*?!\/+\-|<>=]/g,' ').replace(/\s+/g,' ').trim();
 const b=clean(brand||''), t=clean(q||''); const parts=[];
 if(/^\d{8,14}$/.test(t)) parts.push('code:'+t);
 else { if(b) parts.push(`brands:"${b}"`); if(t) parts.push(t); }
 const sort=b||/^\d+$/.test(t)?'&sort_by=-unique_scans_n':'';
 return `https://search.openfoodfacts.org/search?q=${encodeURIComponent(parts.join(' AND '))}&page_size=25&langs=de${sort}&fields=${OFF_FIELDS}`;
}
function offParse(text){
 const i=text.indexOf('{"hits"');
 if(i<0){ if(/temporarily unavailable|nicht verfügbar|503|502/i.test(text)) throw {code:'off_down'}; throw {code:'off_parse'}; }
 let s=text.slice(i); const cut=s.indexOf('\nTab Context'); if(cut>0) s=s.slice(0,cut); s=s.slice(0,s.lastIndexOf('}')+1);
 return offMap(JSON.parse(s).hits);
}
function offMap(list){
 return (list||[]).map(h=>{
  const n=h.nutriments||{}; let k=n['energy-kcal_100g'];
  if(k==null){ const kj=n['energy-kj_100g']??n['energy_100g']; if(kj!=null) k=kj/4.184; }
  const brands=[...new Set((Array.isArray(h.brands)?h.brands:String(h.brands||'').split(',')).map(x=>String(x).trim()).filter(Boolean))];
  const qm=String(h.quantity||'').match(/([\d.,]+)\s*(g|ml)\b/i); const qty=qm?num(qm[1]):0;
  const sv=num(h.serving_quantity);
  const por=sv>0&&sv<=1000?sv:qty>0&&qty<=500?qty:100;
  const pl=sv>0&&sv<=1000?'Portion':qty>0&&qty<=500?'Packung':'Portion';
  const name=(h.product_name_de||h.product_name||'').trim();
  return {id:'off-'+h.code,code:h.code,n:name?(brands[0]&&!name.toLowerCase().includes(brands[0].toLowerCase())?brands[0]+' – '+name:name):(brands[0]||'Unbenanntes Produkt'),
   brand:brands.join(', '),qty:h.quantity||'',k:k==null?null:+k,p:num(n.proteins_100g),c:num(n.carbohydrates_100g),f:num(n.fat_100g),por,pl,cat:'Marke',off:true};
 });
}
async function offCall(tool,input){ return MCP.callTool(OFF_HOST,tool,input,{cache:false}); }
async function offDirect(brand,q){
 const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),15000);
 try{
  const r=await fetch(offUrl(brand,q),{signal:ctl.signal});
  if(!r.ok) throw {code:r.status>=500?'off_down':'off_parse'};
  return offMap((await r.json()).hits);
 }catch(e){
  if(e&&e.code==='off_down') throw e;
  const t2=String(q||'').trim();
  const url=/^\d{8,14}$/.test(t2)
   ?`https://world.openfoodfacts.org/api/v2/product/${t2}.json?fields=${OFF_FIELDS}`
   :`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent((brand+' '+q).trim())}&search_simple=1&json=1&page_size=25&sort_by=unique_scans_n&fields=${OFF_FIELDS}`;
  const r=await fetch(url); if(!r.ok) throw {code:'off_down'};
  const d=await r.json(); return offMap(d.product?[d.product]:d.products);
 }finally{clearTimeout(t)}
}
async function offFetch(url){
 if(OFFTAB){ try{ await offCall('navigate',{url,tabId:OFFTAB}); }catch(e){ if(e&&e.code==='tool_error'){ OFFTAB=null; } else throw e; } }
 if(!OFFTAB){ const r=await offCall('preview_start',{url}); const m=toolText(r).match(/"?tabId"?\s*[:=]?\s*"?([\w-]+)"?/); OFFTAB=m?m[1]:null; }
 const r=await offCall('get_page_text',OFFTAB?{tabId:OFFTAB,max_chars:120000}:{max_chars:120000});
 return offParse(toolText(r));
}
function offErrorText(e){
 const c=e&&e.code;
 return {
  server_not_connected:'Die Live-Suche funktioniert nur, wenn du Iron Ladder in der Claude-Desktop-App öffnest. Dort sucht der eingebaute Browser für dich.',
  not_in_manifest:'Die Suche wurde für diese Seite nicht erlaubt. Du kannst das im Berechtigungsmenü des Artifacts ändern.',
  approval_required:'Die Suche braucht deine Freigabe. Tippe nochmal auf „Suchen“ und erlaube den Zugriff.',
  cancelled:'Suche abgebrochen.',
  off_down:'Open Food Facts ist gerade überlastet. Versuch es in ein paar Sekunden nochmal.',
  off_parse:STANDALONE?'Open Food Facts hat nicht geantwortet. Prüf deine Internetverbindung und such nochmal.':'Die Antwort von Open Food Facts war unvollständig. Bitte nochmal suchen. Falls der Browser nach einer Freigabe für search.openfoodfacts.org fragt, erlaube sie.',
  server_unavailable:'Der App-Browser antwortet gerade nicht. Versuch es gleich nochmal.',
 }[c]||('Suche fehlgeschlagen'+(e&&e.message?': '+e.message:'.'));
}
async function offSearch(){
 const o=FS.off; if(o.busy) return;
 if(!o.brand.trim()&&!o.q.trim()){ o.err='Gib eine Marke, ein Produkt oder einen Barcode ein.'; drawOff(); return; }
 if(!offAvailable()){ o.err=offErrorText({code:'server_not_connected'}); drawOff(); return; }
 o.busy=true; o.err=''; drawOff();
 try{ o.hits=STANDALONE?await offDirect(o.brand,o.q):await offFetch(offUrl(o.brand,o.q)); o.done=true; }
 catch(e){ console.warn(e); o.err=offErrorText(e&&e.name==='AbortError'?{code:'off_down'}:(e&&e.code?e:{code:'off_parse'})); }
 o.busy=false; drawOff();
}

function saveProfile(){ cacheSave(); if(!DB||S.demo) return; const p=clone(S.profile); queue('p',()=>pref().set(p)); }
function saveWorkout(w){ cacheSave(); if(!DB||S.demo) return; const c=clone(w); queue('w'+w.id,()=>pref().collection('workouts').doc(w.id).set(c)); }
function dropWorkout(id){ cacheSave(); if(!DB||S.demo) return; queue('w'+id,()=>pref().collection('workouts').doc(id).delete()); }
function saveDay(date){ cacheSave(); if(!DB||S.demo) return; const e=clone(S.food[date]||[]); queue('d'+date,()=>e.length?pref().collection('days').doc(date).set({entries:e}):pref().collection('days').doc(date).delete()); }
async function connect(){
 if(!window.claude||!window.claude.use) return;
 claude.use('mcp').then(m=>{MCP=m; if(SHEET&&SHEET.kind==='food') drawOff();}).catch(()=>{});
 try{
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user) return;
  const id=await user.id(); if(!id) return;
  DB=db; UID=id;
  const ps=await pref().get();
  if(ps.exists){
   const [ws,ds]=await Promise.all([pref().collection('workouts').get(),pref().collection('days').get()]);
   if(!S.demo){
    S.profile=clone(ps.data()); S.workouts=ws.docs.map(d=>clone(d.data())); S.food={};
    ds.docs.forEach(d=>{S.food[d.id]=clone(d.data()).entries||[]});
    buildEx(); buildFoods(); cacheSave();
   }
  } else if(S.profile&&!S.demo){ saveProfile(); S.workouts.forEach(saveWorkout); Object.keys(S.food).forEach(saveDay); }
  V.sync='cloud'; render();
 }catch(e){ console.warn(e); }
}

/* ============ Berechnungen ============ */
function calcTargets(p){
 const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
 const tdee=bmr*p.activity; const g=GOALS[p.goal];
 const kcal=Math.round((tdee+g.kcal)/10)*10, prot=Math.round(p.weight*g.prot), fat=Math.round(p.weight*0.9);
 return {kcal,p:prot,f:fat,c:Math.max(0,Math.round((kcal-prot*4-fat*9)/4)),tdee:Math.round(tdee)};
}
function repRange(ex){
 const g=S.profile?.goal||'muscle', c=ex.comp;
 return {muscle:c?[6,10]:[10,15],strength:c?[3,6]:[8,12],fatloss:c?[6,10]:[10,15],mobility:c?[8,12]:[12,15],fitness:c?[10,15]:[12,20]}[g];
}
const setCount=ex=>ex.kind==='c'?1:(S.profile?.goal==='strength'&&ex.comp)?4:3;
const restSec=ex=>{const g=S.profile?.goal; if(ex.kind==='t') return 45; return g==='strength'?(ex.comp?180:120):g==='muscle'||g==='fatloss'?(ex.comp?150:90):(ex.comp?90:60)};
const incOf=ex=>ex.comp?(LOWER.has(ex.pat)?5:2.5):(ex.eq==='KH'?2:ex.eq==='KB'||ex.eq==='MA'?2.5:1.25);
const bw=()=>S.profile?.weight||75;
function setScore(ex,s){
 if(ex.kind==='t') return num(s.r); if(ex.kind==='c') return num(s.r);
 const w=ex.kind==='bw'?bw()+num(s.w):num(s.w), r=num(s.r);
 if(r<=0) return 0; return r===1?w:w*(1+Math.min(r,15)/30);
}
const e1rm=(w,r)=>r<=1?w:w*(1+Math.min(r,15)/30);
const sortedW=()=>[...S.workouts].sort((a,b)=>(a.date+String(a.ts)).localeCompare(b.date+String(b.ts)));
function history(exId){ const out=[]; for(const w of sortedW()){const it=w.items.find(i=>i.ex===exId); if(it&&it.sets.length) out.push({date:w.date,sets:it.sets,best:Math.max(...it.sets.map(s=>setScore(EX[exId],s)))})} return out; }
function lastPerf(exId){ const h=history(exId); return h[h.length-1]||null; }

function suggestion(exId){
 const ex=EX[exId]; if(!ex) return null;
 const [lo,hi]=repRange(ex), n=setCount(ex), h=history(exId), last=h[h.length-1];
 if(ex.kind==='t'){ const b=last?Math.max(...last.sets.map(s=>num(s.r))):0, t=last?b+5:30;
  return {n,w:0,r:t,head:last?`${t} s halten`:'30 s halten',text:last?`Letztes Mal ${b} s. Heute 5 s länger.`:'Ruhig atmen, Position kontrolliert halten.',why:'Haltezeit schrittweise steigern'}; }
 if(ex.kind==='c'){ const b=last?Math.max(...last.sets.map(s=>num(s.r))):0, t=last?Math.round(b*1.1):20;
  return {n:1,w:0,r:t,head:`${t} min`,text:last?`Letztes Mal ${b} min. Steigere die Dauer um etwa 10 %.`:'Locker beginnen, du solltest noch sprechen können.',why:'Umfang langsam erhöhen (≈ 10 % pro Woche)'}; }
 if(!last){ return {n,w:0,r:lo,head:`${n} × ${lo}–${hi}`,text:`Neue Übung. Wähle ein Gewicht, mit dem du ${lo}–${hi} Wdh. schaffst und noch 2–3 Wdh. im Tank hast.`,why:'Startgewicht über RIR kalibrieren'}; }
 const ws=last.sets.map(s=>num(s.w)), top=Math.max(...ws), topSets=last.sets.filter(s=>num(s.w)===top), minR=Math.min(...topSets.map(s=>num(s.r)));
 let stall=''; if(h.length>=4){const b=h.slice(-4).map(x=>x.best); if(b[3]<=b[0]*1.005) stall=' Seit 3 Einheiten kein Fortschritt: plane einen Deload (−10 % Gewicht) oder prüfe Schlaf und Kalorien.';}
 if(ex.kind==='bw'&&top===0){
  if(minR>=hi) return {n,w:2.5,r:lo,head:`+2,5 kg × ${lo}`,text:`Alle Sätze bei ${hi}+ Wdh. Zeit für Zusatzgewicht.`+stall,why:'Progressive Overload über Zusatzlast'};
  return {n,w:0,r:minR+1,head:`${n} × ${minR+1} Wdh.`,text:`Letztes Mal mindestens ${minR} Wdh. Heute eine mehr pro Satz.`+stall,why:'Wiederholungen steigern'};
 }
 if(topSets.every(s=>num(s.r)>=hi)){ const w=r05(top+incOf(ex)); return {n,w,r:lo,head:`${fmt(w,2)} kg × ${lo}`,text:`Alle Sätze mit ${hi} Wdh. geschafft. +${fmt(incOf(ex),2)} kg und wieder bei ${lo} Wdh. starten.`+stall,why:'Doppelte Progression (Progressive Overload)'}; }
 if(minR<lo-1){ const w=r05(top*0.9); return {n,w,r:lo,head:`${fmt(w,2)} kg × ${lo}`,text:`Letztes Mal nur ${minR} Wdh. Mit 10 % weniger Gewicht wieder sauber in den Zielbereich ${lo}–${hi}.`,why:'Im Zielbereich arbeiten, Technik sichern'}; }
 const r=Math.min(hi,Math.max(lo,minR+1));
 return {n,w:top,r,head:`${fmt(top,2)} kg × ${r}`,text:`Gleiches Gewicht, Ziel ${r} Wdh. pro Satz (letztes Mal ${minR}). Erst bei ${hi} Wdh. in allen Sätzen steigt das Gewicht.`+stall,why:'Wiederholungen vor Gewicht steigern'};
}

/* Ranglogik: aus allen Trainings neu berechnet */
function computeRanks(list){
 const ws=(list||sortedW()); const sr={}; MKEYS.forEach(m=>sr[m]=0);
 const week={}, best={}, gains={}, prs={};
 for(const w of ws){
  const wk=weekKey(w.date); const g={}; const add=(m,v)=>{sr[m]+=v;g[m]=(g[m]||0)+v};
  prs[w.id]=[];
  for(const it of w.items){
   const ex=EX[it.ex]; if(!ex||!it.sets.length) continue;
   for(const s of it.sets){
    if(num(s.r)<=0) continue;
    const credit=ex.kind==='c'?Math.min(3,Math.floor(num(s.r)/10)):1;
    for(let c=0;c<credit;c++){
     const k=wk+ex.prim; week[k]=(week[k]||0)+1;
     if(week[k]<=20) add(ex.prim,10);
     if(week[k]===10) add(ex.prim,40);
     ex.sec.forEach(m=>{const k2=wk+m; week[k2]=(week[k2]||0)+.5; if(week[k2]<=20) add(m,4); if(week[k2]===10) add(m,40)});
    }
   }
   const sc=Math.max(...it.sets.map(s=>setScore(ex,s)));
   if(best[it.ex]===undefined){ best[it.ex]=sc; add(ex.prim,5); }
   else if(sc>best[it.ex]*1.001){ best[it.ex]=sc; add(ex.prim,25); ex.sec.forEach(m=>add(m,8)); prs[w.id].push(it.ex); }
  }
  gains[w.id]=g;
 }
 return {sr,gains,prs,best};
}
function weekSets(wk){ const out={}; MKEYS.forEach(m=>out[m]=0);
 for(const w of S.workouts){ if(weekKey(w.date)!==wk) continue; for(const it of w.items){const ex=EX[it.ex]; if(!ex) continue; const n=it.sets.filter(s=>num(s.r)>0).length; out[ex.prim]+=n; ex.sec.forEach(m=>out[m]+=n*.5)} }
 return out; }
function streakWeeks(){ const per={}; S.workouts.forEach(w=>{const k=weekKey(w.date);per[k]=(per[k]||0)+1});
 let k=weekKey(today()), n=0; if((per[k]||0)<S.profile.days) k=addDays(k,-7);
 while((per[k]||0)>=S.profile.days){n++;k=addDays(k,-7)} return n; }
const totalXP=sr=>Object.values(sr).reduce((a,b)=>a+b,0);
const levelOf=xp=>Math.floor(Math.sqrt(xp/40))+1;

function nextPlan(){ const sp=SPLITS[S.profile.split]||SPLITS.fb; const key=sp.rot[(S.profile.rot||0)%sp.rot.length]; return {key,day:DAYS[key],idx:(S.profile.rot||0)%sp.rot.length+1,len:sp.rot.length}; }
function planIds(key){ const d=DAYS[key]; let names=[...d.ex]; const g=S.profile.goal;
 if(g==='mobility'&&key!=='MO') names=names.slice(0,5).concat(MOB_ADD[d.t]);
 if(g==='fitness') names=names.slice(0,5).concat(['Rudergerät']);
 if(g==='fatloss') names=names.concat(['Crosstrainer']);
 return names.map(slug).filter(id=>EX[id]); }

function heroFacts(ids){

 const mins=Math.round(ids.reduce((a,id)=>{const e=EX[id];return a+(e.kind==='c'?20*60:setCount(e)*(45+restSec(e)))},0)/60/5)*5;
 const map=muscleMap(m=>prim.has(m)?{c:'var(--on-hero)'}:sec.has(m)?{c:'var(--on-hero)',o:.45}:{c:'var(--hero-off)'});
 return `<div class="hero-facts"><div class="hero-map" role="img" aria-label="Trainierte Muskeln: ${[...prim].map(m=>MUSCLES[m]).join(', ')}">${map}</div>
  <dl><div><dt>Arbeitssätze</dt><dd class="num">${sets}</dd></div><div><dt>Dauer, geschätzt</dt><dd class="num">${mins} min</dd></div><div><dt>Fokus</dt><dd>${[...prim].slice(0,3).map(m=>MUSCLES[m]).join(', ')}</dd></div></dl></div>`;
}

function renderExCard(it,i){

  <div style="overflow-x:auto"><table class="sets"><thead><tr><th>Satz</th><th>Vorher</th>${isT||isC?'':`<th>${wl}</th>`}<th>${rl}</th>${isT||isC?'':'<th>RIR</th>'}<th></th></tr></thead><tbody>
  ${it.sets.map((st,j)=>{const pv=last&&last.sets[j]; const prev=pv?(isT||isC?`${fmt(pv.r)}`:`${fmt(pv.w,2)}×${fmt(pv.r)}`):'–';
   return `<tr class="${st.done?'done':''}"><td class="num">${j+1}</td><td class="prev">${prev}</td>
   ${isT||isC?'':`<td><input type="text" inputmode="decimal" aria-label="Gewicht Satz ${j+1}" value="${st.w===''?'':esc(String(st.w).replace('.',','))}" placeholder="${s.w?fmt(s.w,2):'0'}" data-set="${i}.${j}.w" style="width:70px"></td>`}
   <td><input type="text" inputmode="numeric" aria-label="${rl} Satz ${j+1}" value="${st.r===''?'':esc(st.r)}" placeholder="${s.r}" data-set="${i}.${j}.r" style="width:60px"></td>
   ${isT||isC?'':`<td><input type="text" inputmode="numeric" aria-label="RIR Satz ${j+1}" value="${st.rir??''}" placeholder="2" data-set="${i}.${j}.rir" style="width:48px"></td>`}
   <td><button class="check" data-act="toggleSet" data-v="${i}.${j}" aria-label="Satz ${j+1} abhaken" aria-pressed="${!!st.done}">${I.check}</button></td></tr>`}).join('')}
  </tbody></table></div>
  <div class="row"><button class="btn sm ghost" data-act="addSet" data-i="${i}">${I.plus.replace('<svg','<svg width="14" height="14"')} Satz</button>${it.sets.length>1?`<button class="btn sm ghost" data-act="rmSet" data-i="${i}">Letzten Satz entfernen</button>`:''}<span class="muted" style="font-size:.875rem;margin-left:auto">Pause ${Math.round(restSec(ex)/60*10)/10} min</span></div>
 </div>`;
}

const MEALS=[['b','Frühstück'],['l','Mittagessen'],['d','Abendessen'],['s','Snacks']];
function dayTotals(date){ return (S.food[date]||[]).reduce((a,e)=>({k:a.k+e.k,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{k:0,p:0,c:0,f:0}); }
function ring(v,max,size=150){
 const r=size/2-10, C=2*Math.PI*r, pct=Math.min(1,v/max), over=v>max;
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${fmt(v)} von ${fmt(max)} kcal"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${over?'var(--bad)':'var(--accent)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="46%" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="28" font-weight="600" fill="var(--fg)">${fmt(Math.abs(max-v))}</text><text x="50%" y="62%" text-anchor="middle" font-size="12" fill="var(--muted)">${over?'kcal drüber':'kcal übrig'}</text></svg>`;
}

 <p class="muted" style="font-size:.875rem;margin:0">Datenbank mit ${FOODS.filter(f=>!f.dish&&!f.own).length} Lebensmitteln (Nährwerte je 100 g) und ${FOODS.filter(f=>f.dish).length} fertigen Gerichten. Werte für Fertiggerichte sind Durchschnittswerte typischer Portionen. Markenprodukte suchst du live über Open Food Facts${(S.profile.offFoods||[]).length?`; ${S.profile.offFoods.length} davon hast du schon gespeichert`:''}.</p>`;

/* ---- Fortschritt ---- */
function niceStep(x){ const e=Math.pow(10,Math.floor(Math.log10(x||1))); const f=x/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; }
function lineChart(pts,unit){
 if(pts.length<2) return `<div class="empty">Mindestens zwei Einträge nötig, dann erscheint hier deine Kurve.</div>`;
 const W=640,H=230,L=48,R=18,T=16,B=30;
 const xs=pts.map(p=>p.t), ys=pts.map(p=>p.y);
 let x0=Math.min(...xs), x1=Math.max(...xs); if(x1===x0) x1=x0+864e5;
 let lo=Math.min(...ys), hi=Math.max(...ys); const padv=(hi-lo)*.2||Math.max(1,hi*.05); lo-=padv; hi+=padv;
 const st=niceStep((hi-lo)/4); lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
 const X=t=>L+(t-x0)/(x1-x0)*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
 let g=''; for(let v=lo;v<=hi+1e-9;v+=st){ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(v,1)}</text>`; }
 const d=pts.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
 const area=d+` L${X(pts[pts.length-1].t).toFixed(1)} ${H-B} L${X(pts[0].t).toFixed(1)} ${H-B} Z`;
 const lab=t=>new Date(t).toLocaleDateString('de-DE',{day:'numeric',month:'short'});
 const last=pts[pts.length-1];
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">${g}<path d="${area}" fill="var(--accent)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.y)}" r="2.6" fill="var(--accent)"/>`).join('')}<circle cx="${X(last.t)}" cy="${Y(last.y)}" r="5.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${Math.min(X(last.t),W-R)}" y="${Math.max(Y(last.y)-12,T+10)}" text-anchor="end" font-size="13" font-weight="600" fill="var(--fg)">${fmt(last.y,1)} ${unit}</text><text x="${L}" y="${H-8}" font-size="12" fill="var(--muted)">${lab(x0)}</text><text x="${W-R}" y="${H-8}" text-anchor="end" font-size="12" fill="var(--muted)">${lab(x1)}</text></svg>`;
}

  <div><button class="btn sm ghost danger" data-act="delWo" data-v="${w.id}">${V.histOpen['del'+w.id]?'Wirklich löschen?':'Training löschen'}</button></div></div></details>`}).join('')}</div>`:`<div class="empty" style="margin-top:10px">Noch keine Trainings.</div>`}</div>`;

  obSet:()=>{const o=V.ob;o[b.dataset.k]=['days'].includes(b.dataset.k)?+v:v; if(b.dataset.k==='days'||b.dataset.k==='goal') o.split=recSplit(o.days,o.goal); render()},
  obBack:()=>{V.ob.step--;render()},
  obNext:()=>{const o=V.ob; if(o.step<4){o.step++;render();window.scrollTo(0,0);return}
   S.profile={name:o.name.trim(),goal:o.goal,days:o.days,split:o.split,sex:o.sex,age:o.age,height:o.height,weight:o.weight,activity:o.activity,rot:0,customEx:[],customFoods:[],weights:{[today()]:o.weight},created:today()};
   S.profile.targets=calcTargets(S.profile); buildEx(); buildFoods(); saveProfile(); V.tab='home'; render(); toast('Profil erstellt. Willkommen auf der Leiter!')},
  demo:loadDemo,
  exitDemo:()=>{S={profile:null,workouts:[],food:{},draft:null,demo:false}; V.ob=obDefaults(); cacheLoad(); if(S.profile){buildEx();buildFoods()} render()},
  settings:()=>{V.resetAsk=false;openSheet('settings')},
  startPlan:()=>{const np=nextPlan();newDraft(np.day.n,planIds(np.key),np.key)},
  startDay:()=>{const d=newDraft(DAYS[v].n,planIds(v),v); S.draft.offPlan=v!==nextPlan().key; draftSave()},
  startFree:()=>newDraft('Freies Training',[],null),
  startWith:()=>newDraft('Freies Training',[v],null),
  lib:()=>{openSheet('lib')}, addEx:()=>openSheet('pick'),
  libM:()=>{V.libM=v; drawSheet()},
  exInfo:()=>openSheet('info',v),
  pickEx:()=>{S.draft.items.push(makeItem(v)); draftSave(); closeSheet(); render(); toast(EX[v].n+' hinzugefügt')},
  rmEx:()=>{S.draft.items.splice(+b.dataset.i,1); draftSave(); render()},
  addSet:()=>{const it=S.draft.items[+b.dataset.i]; const l=it.sets[it.sets.length-1]||{w:'',r:''}; it.sets.push({w:l.w,r:l.r,rir:'',done:false}); draftSave(); render()},
  rmSet:()=>{S.draft.items[+b.dataset.i].sets.pop(); draftSave(); render()},
  toggleSet:()=>{const [i,j]=v.split('.').map(Number); const it=S.draft.items[i], s=it.sets[j];
   const row=b.closest('tr'); row.querySelectorAll('input').forEach(inp=>{const k=inp.dataset.set.split('.')[2]; if(inp.value===''&&inp.placeholder&&k!=='rir') {inp.value=inp.placeholder; s[k]=inp.placeholder}});
   if(!s.done&&num(s.r)<=0){toast('Trage zuerst die Wiederholungen ein.');return}
   s.done=!s.done; row.classList.toggle('done',s.done); b.setAttribute('aria-pressed',s.done);
   if(s.done) S.rest={end:Date.now()+restSec(EX[it.ex])*1000}; draftSave(); tick()},
  restAdd:()=>{if(S.rest){S.rest.end+=30000;S.rest.buzzed=false} tick()},
  restSkip:()=>{S.rest=null;tick()},
  finishWo:finishWorkout,
  cancelWo:()=>{if(!S.draft.cancelAsk){S.draft.cancelAsk=true;render();setTimeout(()=>{if(S.draft){S.draft.cancelAsk=false;render()}},4000);return} S.draft=null;S.rest=null;draftSave();render();toast('Training verworfen')},
  customEx:()=>openSheet('customEx'),
  saveCustomEx:()=>{const n=$('#ce-n').value.trim(); if(!n){toast('Gib der Übung einen Namen.');return}
   const c={id:'c-'+slug(n)+'-'+uid().slice(-4),n,pat:$('#ce-p').value,eq:$('#ce-e').value,prim:$('#ce-m').value,sec:$('#ce-s').value,kind:$('#ce-k').value};
   S.profile.customEx=(S.profile.customEx||[]).concat(c); buildEx(); saveProfile();
   if(S.draft){S.draft.items.push(makeItem(c.id));draftSave();closeSheet();render()} else openSheet('info',c.id); toast('Übung gespeichert')},
  delCustomEx:()=>{S.profile.customEx=S.profile.customEx.filter(c=>c.id!==v); buildEx(); saveProfile(); closeSheet(); render()},
  foodDay:()=>{V.foodDate=addDays(V.foodDate,+v);render()},
  addFood:()=>{FS={meal:v,q:'',cat:'all',sel:null,g:100,off:offState()};openSheet('food')},
  foodCat:()=>{FS.cat=v;FS.sel=null;drawSheet(); if(v==='off') setTimeout(()=>{const el=$('#off-brand'); if(el&&!FS.off.done) el.focus()},30)},
  toOff:()=>{FS.cat='off'; FS.sel=null; if(FS.q&&!FS.off.q&&!FS.off.brand) FS.off.q=FS.q; drawSheet(); setTimeout(()=>{const el=$('#off-brand'); if(el) el.focus()},30)},
  selFood:()=>{FS.sel=v; const f=findFood(v); FS.g=f.por; document.querySelectorAll('#food-res button,#off-res button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v)); $('#food-amount').innerHTML=foodAmount(f); $('#food-amount').scrollIntoView({block:'nearest',behavior:'smooth'})},
  foodG:()=>{FS.g=+v; const f=findFood(FS.sel); $('#food-amount').innerHTML=foodAmount(f)},
  confirmFood:()=>{const f=findFood(FS.sel); const g=FS.g; if(!f||g<=0){toast('Menge eingeben.');return}
   if(f.off&&!(S.profile.offFoods||[]).some(x=>x.id===f.id)){ const keep={id:f.id,code:f.code,n:f.n,brand:f.brand,qty:f.qty,k:Math.round(f.k*10)/10,p:f.p,c:f.c,f:f.f,por:f.por,pl:f.pl};
    S.profile.offFoods=[keep].concat(S.profile.offFoods||[]).slice(0,300); buildFoods(); saveProfile(); }
   const e={id:uid(),fid:f.id,n:f.n,g,meal:FS.meal,k:f.k*g/100,p:f.p*g/100,c:f.c*g/100,f:f.f*g/100};
   (S.food[V.foodDate]=S.food[V.foodDate]||[]).push(e); saveDay(V.foodDate); closeSheet(); render(); toast(`${f.n} eingetragen (${fmt(e.k)} kcal)`)},
  rmFood:()=>{S.food[V.foodDate]=(S.food[V.foodDate]||[]).filter(e=>e.id!==v); saveDay(V.foodDate); render()},
  customFood:()=>openSheet('customFood'),
  saveCustomFood:()=>{const n=$('#cf-n').value.trim(); const k=num($('#cf-k').value); if(!n||!k){toast('Name und Kalorien sind Pflicht.');return}
   const c={id:'o-'+slug(n)+'-'+uid().slice(-4),n,k,p:num($('#cf-p').value),c:num($('#cf-c').value),f:num($('#cf-f').value),por:num($('#cf-por').value)||100,pl:'Portion'};
   S.profile.customFoods=(S.profile.customFoods||[]).concat(c); buildFoods(); saveProfile(); FS.sel=c.id; FS.g=c.por; FS.q=''; FS.cat='own'; openSheet('food')},
  saveBW:()=>{const x=num($('#bw-in').value); if(x<30||x>300){toast('Gib ein Gewicht in kg ein.');return} S.profile.weights=S.profile.weights||{}; S.profile.weights[today()]=x; S.profile.weight=x; saveProfile(); render(); toast('Gewicht gespeichert')},
  delWo:()=>{if(!V.histOpen['del'+v]){V.histOpen['del'+v]=true;V.histOpen[v]=true;render();return} S.workouts=S.workouts.filter(w=>w.id!==v); dropWorkout(v); delete V.histOpen['del'+v]; render(); toast('Training gelöscht')},
  recalc:()=>{const p=Object.assign({},S.profile,readSettings()); const t=calcTargets(p); ['kcal','p','c','f'].forEach(k=>$('#st-t-'+k).value=t[k])},
  saveSettings:()=>{const x=readSettings(); Object.assign(S.profile,x); S.profile.targets={kcal:num($('#st-t-kcal').value),p:num($('#st-t-p').value),c:num($('#st-t-c').value),f:num($('#st-t-f').value),tdee:calcTargets(S.profile).tdee}; saveProfile(); closeSheet(); render(); toast('Gespeichert')},
  resetAll:()=>{if(!V.resetAsk){V.resetAsk=true;drawSheet();return}
   const ids=S.workouts.map(w=>w.id), days=Object.keys(S.food);
   if(DB&&!S.demo){queue('p',()=>pref().delete()); ids.forEach(dropWorkout); days.forEach(d=>{S.food[d]=[];saveDay(d)});}
   try{localStorage.removeItem(LS);localStorage.removeItem(LS+'.draft')}catch(e){}
   S={profile:null,workouts:[],food:{},draft:null,demo:false}; V.ob=obDefaults(); V.resetAsk=false; closeSheet(); render()},
 };
 if(H[a]){ e.preventDefault(); H[a](); }
});
function readSettings(){ return {name:$('#st-name').value.trim(),goal:$('#st-goal').value,days:+$('#st-days').value,split:$('#st-split').value,weight:num($('#st-w').value)||S.profile.weight,height:num($('#st-h').value)||S.profile.height,age:num($('#st-age').value)||S.profile.age,activity:num($('#st-act').value)}; }

document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.ob){ V.ob[t.dataset.ob]=t.dataset.ob==='name'?t.value:num(t.value); return; }
 if(t.dataset.set){ const [i,j,k]=t.dataset.set.split('.'); const s=S.draft.items[+i].sets[+j]; s[k]=k==='w'?t.value.replace(',','.'):t.value; clearTimeout(window._ds); window._ds=setTimeout(draftSave,400); return; }
 if(t.dataset.lib!==undefined){ V.libQ=t.value; $('#lib-res').innerHTML=libResults(SHEET.kind==='pick'); return; }
 if(t.dataset.fq!==undefined){ FS.q=t.value; $('#food-res').innerHTML=foodList(foodResults()); return; }
 if(t.dataset.off){ FS.off[t.dataset.off]=t.value; return; }
 if(t.dataset.fg!==undefined){ FS.g=num(t.value); const f=findFood(FS.sel); const m=v=>v*FS.g/100; $('#food-macros').innerHTML=`<span><b class="num">${fmt(m(f.k))}</b> kcal</span><span>P <b class="num">${fmt(m(f.p),1)}</b> g</span><span>KH <b class="num">${fmt(m(f.c),1)}</b> g</span><span>F <b class="num">${fmt(m(f.f),1)}</b> g</span>`; return; }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.matches('[data-food-date]')&&t.value){ V.foodDate=t.value; render(); }
 if(t.matches('[data-prog-ex]')){ V.progEx=t.value; render(); }
 if(t.id==='ce-p'||t.id==='ce-m'||t.id==='ce-s'){ const prim=$('#ce-m').value, sec=$('#ce-s').value; $('#ce-prev').innerHTML=figure($('#ce-p').value)+muscleMap(m=>m===prim?{c:'var(--accent)'}:m===sec?{c:'var(--accent)',o:.42}:{c:'var(--map-off)'}); }
});
document.addEventListener('toggle',e=>{ const d=e.target; if(d.dataset&&d.dataset.hist) V.histOpen[d.dataset.hist]=d.open; },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&SHEET) closeSheet(); });
document.addEventListener('submit',e=>{ if(e.target.matches('[data-off-form]')){ e.preventDefault(); FS.sel=null; const a=$('#food-amount'); if(a) a.innerHTML=''; offSearch(); } });

/* ============ Start ============ */
cacheLoad(); buildEx(); buildFoods();
if(S.draft) S.draft.items.forEach(it=>{if(!EX[it.ex]) it.ex=null}); if(S.draft) S.draft.items=S.draft.items.filter(it=>it.ex);
render();
connect();
</script>
