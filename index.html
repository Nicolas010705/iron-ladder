    if(ps.length>1&&next!==undefined){ S.rest=null; toast('Weiter mit '+EX[S.draft.items[next].ex].n); const c=document.querySelectorAll('.ex-card')[next]; if(c) c.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'}); }
    else S.rest={end:Date.now()+Math.max(...ps.map(k=>restSec(EX[S.draft.items[k].ex])))*1000}; }
   draftSave(); tick()},
  restAdd:()=>{if(S.rest){S.rest.end+=30000;S.rest.buzzed=false} tick()},
  restSkip:()=>{S.rest=null;tick()},
  finishWo:()=>{ if(!S.draft.items.some(it=>it.sets.some(x=>x.done&&num(x.r)>0))){toast('Hake mindestens einen Satz ab, um das Training zu speichern.');return} RATE={feel:0,rpe:7,tags:[]}; openSheet('rate'); },
  rateFeel:()=>{RATE.feel=+v; haptic(6); drawSheet()},
  rateTag:()=>{RATE.tags=RATE.tags.includes(v)?RATE.tags.filter(t=>t!==v):[...RATE.tags,v]; drawSheet()},
  saveRated:()=>{ if(!RATE.feel) return; closeSheet(); setTimeout(()=>finishWorkout({...RATE}),REDUCED?0:280); },
  saveUnrated:()=>{ closeSheet(); setTimeout(()=>finishWorkout(null),REDUCED?0:280); },
  cancelWo:()=>{if(!S.draft.cancelAsk){S.draft.cancelAsk=true;render();setTimeout(()=>{if(S.draft){S.draft.cancelAsk=false;render()}},4000);return} S.draft=null;S.rest=null;draftSave();render();toast('Training verworfen')},
  customEx:()=>openSheet('customEx'),
  saveCustomEx:()=>{const n=$('#ce-n').value.trim(); if(!n){toast('Gib der Übung einen Namen.');return}
   const c={id:'c-'+slug(n)+'-'+uid().slice(-4),n,pat:$('#ce-p').value,eq:$('#ce-e').value,prim:$('#ce-m').value,sec:$('#ce-s').value,kind:$('#ce-k').value};
   S.profile.customEx=(S.profile.customEx||[]).concat(c); buildEx(); saveProfile();
   if(S.draft){S.draft.items.push(makeItem(c.id));draftSave();closeSheet();render()} else openSheet('info',c.id); toast('Übung gespeichert')},
  delCustomEx:()=>{S.profile.customEx=S.profile.customEx.filter(c=>c.id!==v); buildEx(); saveProfile(); closeSheet(); render()},
  foodDay:()=>{V.foodDate=addDays(V.foodDate,+v);render()},
  addFood:()=>{FS={meal:v,q:'',cat:'all',sel:null,g:100,off:offState()};openSheet('food')},
  foodCat:()=>{FS.cat=v;FS.sel=null;drawSheet(); if(v==='off') setTimeout(()=>{const el=$('#off-brand'); if(el&&!FS.off.done) el.focus()},30)},
  toOff:()=>{FS.cat='off'; FS.sel=null; if(FS.q&&!FS.off.q&&!FS.off.brand) FS.off.q=FS.q; drawSheet(); setTimeout(()=>{const el=$('#off-brand'); if(el) el.focus()},30)},
  selFood:()=>{FS.sel=v; const f=findFood(v); FS.g=f.por; document.querySelectorAll('#food-res button,#off-res button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v)); $('#food-amount').innerHTML=foodAmount(f); $('#food-amount').scrollIntoView({block:'nearest',behavior:'smooth'})},
  foodG:()=>{FS.g=+v; const f=findFood(FS.sel); $('#food-amount').innerHTML=foodAmount(f)},
  confirmFood:()=>{const f=findFood(FS.sel); const g=FS.g; if(!f||g<=0){toast('Menge eingeben.');return}
   if(f.off&&!(S.profile.offFoods||[]).some(x=>x.id===f.id)){ const keep={id:f.id,code:f.code,n:f.n,brand:f.brand,qty:f.qty,k:Math.round(f.k*10)/10,p:f.p,c:f.c,f:f.f,por:f.por,pl:f.pl};
    S.profile.offFoods=[keep].concat(S.profile.offFoods||[]).slice(0,300); buildFoods(); saveProfile(); }
   const e={id:uid(),fid:f.id,n:f.n,g,meal:FS.meal,k:f.k*g/100,p:f.p*g/100,c:f.c*g/100,f:f.f*g/100};
   (S.food[V.foodDate]=S.food[V.foodDate]||[]).push(e); saveDay(V.foodDate); closeSheet(); render(); toast(`${f.n} eingetragen (${fmt(e.k)} kcal)`)},
  rmFood:()=>{S.food[V.foodDate]=(S.food[V.foodDate]||[]).filter(e=>e.id!==v); saveDay(V.foodDate); render()},
  customFood:()=>openSheet('customFood'),
  saveCustomFood:()=>{const n=$('#cf-n').value.trim(); const k=num($('#cf-k').value); if(!n||!k){toast('Name und Kalorien sind Pflicht.');return}
   const c={id:'o-'+slug(n)+'-'+uid().slice(-4),n,k,p:num($('#cf-p').value),c:num($('#cf-c').value),f:num($('#cf-f').value),por:num($('#cf-por').value)||100,pl:'Portion'};
   S.profile.customFoods=(S.profile.customFoods||[]).concat(c); buildFoods(); saveProfile(); FS.sel=c.id; FS.g=c.por; FS.q=''; FS.cat='own'; openSheet('food')},
  saveBW:()=>{const x=num($('#bw-in').value); if(x<30||x>300){toast('Gib ein Gewicht in kg ein.');return} S.profile.weights=S.profile.weights||{}; S.profile.weights[today()]=x; S.profile.weight=x; saveProfile(); render(); toast('Gewicht gespeichert')},
  delWo:()=>{if(!V.histOpen['del'+v]){V.histOpen['del'+v]=true;V.histOpen[v]=true;render();return} S.workouts=S.workouts.filter(w=>w.id!==v); dropWorkout(v); delete V.histOpen['del'+v]; render(); toast('Training gelöscht')},
  recalc:()=>{const p=Object.assign({},S.profile,readSettings()); const t=calcTargets(p); ['kcal','p','c','f'].forEach(k=>$('#st-t-'+k).value=t[k])},
  saveSettings:()=>{const x=readSettings(); Object.assign(S.profile,x); S.profile.meso=S.profile.meso||{start:weekKey(today()),len:5}; S.profile.meso.len=+$('#st-meso').value||5;
 S.profile.targets={kcal:num($('#st-t-kcal').value),p:num($('#st-t-p').value),c:num($('#st-t-c').value),f:num($('#st-t-f').value),tdee:calcTargets(S.profile).tdee}; saveProfile(); closeSheet(); render(); toast('Gespeichert')},
  resetAll:()=>{if(!V.resetAsk){V.resetAsk=true;drawSheet();return}
   const ids=S.workouts.map(w=>w.id), days=Object.keys(S.food);
   if(DB&&!S.demo){queue('p',()=>pref().delete()); ids.forEach(dropWorkout); days.forEach(d=>{S.food[d]=[];saveDay(d)});}
   try{localStorage.removeItem(LS);localStorage.removeItem(LS+'.draft')}catch(e){}
   S={profile:null,workouts:[],food:{},draft:null,demo:false}; V.ob=obDefaults(); V.resetAsk=false; closeSheet(); render()},
 };
 if(H[a]){ e.preventDefault(); H[a](); }
});
function readSettings(){ return {name:$('#st-name').value.trim(),goal:$('#st-goal').value,days:+$('#st-days').value,split:$('#st-split').value,weight:num($('#st-w').value)||S.profile.weight,height:num($('#st-h').value)||S.profile.height,age:num($('#st-age').value)||S.profile.age,activity:num($('#st-act').value)}; }

document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.ob){ V.ob[t.dataset.ob]=t.dataset.ob==='name'?t.value:num(t.value); return; }
 if(t.dataset.set){ const [i,j,k]=t.dataset.set.split('.'); const s=S.draft.items[+i].sets[+j]; s[k]=k==='w'?t.value.replace(',','.'):t.value; clearTimeout(window._ds); window._ds=setTimeout(draftSave,400); return; }
 if(t.dataset.lib!==undefined){ V.libQ=t.value; $('#lib-res').innerHTML=libResults(SHEET.kind==='pickPlan'?'plan':SHEET.kind==='pick'); return; }
 if(t.dataset.fq!==undefined){ FS.q=t.value; $('#food-res').innerHTML=foodList(foodResults()); return; }
 if(t.dataset.off){ FS.off[t.dataset.off]=t.value; return; }
 if(t.dataset.planName){ const pl=(S.profile.plans||[]).find(x=>x.id===t.dataset.planName); if(pl){pl.n=t.value; clearTimeout(window._pn); window._pn=setTimeout(saveProfile,500);} return; }
 if(t.dataset.set&&t.dataset.set.endsWith('.w')){ const i=+t.dataset.set.split('.')[0]; const it=S.draft.items[i]; const pl=document.querySelector(`[data-plates="${i}"]`); if(pl){ const s0=it.sugg||suggestion(it.ex); const st=it.sets.find(x=>!x.done)||it.sets[0]; pl.innerHTML=platesHTML(num(String(st.w).replace(',','.'))||s0.w,barOf(EX[it.ex])); } }
 if(t.dataset.rpe!==undefined){ RATE.rpe=+t.value; const o=$('#rpe-v'); if(o) o.textContent=RATE.rpe+'/10'; return; }
 if(t.dataset.fg!==undefined){ FS.g=num(t.value); const f=findFood(FS.sel); const m=v=>v*FS.g/100; $('#food-macros').innerHTML=`<span><b class="num">${fmt(m(f.k))}</b> kcal</span><span>P <b class="num">${fmt(m(f.p),1)}</b> g</span><span>KH <b class="num">${fmt(m(f.c),1)}</b> g</span><span>F <b class="num">${fmt(m(f.f),1)}</b> g</span>`; return; }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.matches('[data-ph-file]')&&t.files&&t.files[0]){ const f=t.files[0]; t.value=''; shrinkImage(f).then(data=>phPut({id:uid(),date:today(),ts:Date.now(),data})).then(()=>{PHOTOS=null; drawPhotos(); toast('Foto gespeichert')}).catch(()=>toast('Das Foto konnte nicht gespeichert werden.')); return; }
 if(t.matches('[data-scan-file]')&&t.files&&t.files[0]){ const f=t.files[0]; t.value=''; const m=$('#scan-msg'); if(m) m.textContent='Lese Barcode …'; decodeImageFile(f).then(code=>{ if(code) scanFound(code); else throw 0; }).catch(()=>{ const m2=$('#scan-msg'); if(m2) m2.textContent='Kein Barcode erkannt. Versuch es näher und scharf, ohne Spiegelung.'; }); return; }
 if(t.matches('[data-food-date]')&&t.value){ V.foodDate=t.value; render(); }
 if(t.matches('[data-prog-ex]')){ V.progEx=t.value; render(); }
 if(t.id==='ce-p'||t.id==='ce-m'||t.id==='ce-s'){ const prim=$('#ce-m').value, sec=$('#ce-s').value; $('#ce-prev').innerHTML=figure($('#ce-p').value)+muscleMap(m=>m===prim?{c:'var(--accent)'}:m===sec?{c:'var(--accent)',o:.42}:{c:'var(--map-off)'}); }
});
document.addEventListener('toggle',e=>{ const d=e.target; if(d.dataset&&d.dataset.hist) V.histOpen[d.dataset.hist]=d.open; },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&SHEET) closeSheet(); });
document.addEventListener('submit',e=>{ if(e.target.matches('[data-off-form]')){ e.preventDefault(); FS.sel=null; const a=$('#food-amount'); if(a) a.innerHTML=''; offSearch(); } });

cacheLoad(); buildEx(); buildFoods();
if(S.draft) S.draft.items.forEach(it=>{if(!EX[it.ex]) it.ex=null}); if(S.draft) S.draft.items=S.draft.items.filter(it=>it.ex);
render();
connect();
