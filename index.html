<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Ladder</title>
<meta name="description" content="Gym-Tracker mit Rängen pro Muskelgruppe, Ernährungstracking und Zielen nach Progressive Overload.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Ladder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.IRON_STANDALONE=true;</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: native App-Optik wie iOS – große Titel, gruppierte Karten, halbtransparente Tabbar, Pillen-Buttons.
   Eine Akzentfarbe (Grün = Fortschritt), Hauptaktion in Tinte (Schwarz/Weiß). Dunkelmodus in echtem Schwarz. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#e9e9ef; --row:#f4f4f8; --line:#d8d8de; --fg:#0b0b0f; --muted:#5f5f68;
  --accent:#00a86b; --accent-ink:#ffffff; --accent-soft:#e3f6ee; --accent-text:#007a4d;
  --ink:#0b0b0f; --on-ink:#ffffff;
  --hero:#ffffff; --on-hero:#0b0b0f; --on-hero-muted:#5f5f68; --hero-row:#f4f4f8; --hero-off:#e1e1e8;
  --teal:#00a86b; --teal-soft:#e3f6ee; --good:#00a86b; --warn:#c98a00; --bad:#e5383b; --yellow-soft:#fff6dc;
  --plate-blue:#2f6bff; --plate-yellow:#ffb800; --plate-green:#00a86b; --plate-red:#e5383b;
  --map-off:#dcdce3; --fig:#2c2c34; --tabbar:rgba(249,249,251,.82);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  --r:18px; --r-sm:12px; --ease:cubic-bezier(.32,.72,0,1); --tap:44px;
  --ease-ios:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.22,1,.36,1);
  --spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017 20.2%,1.043 23.1%,1.044 26.4%,1.031 30%,1.008 37.6%,.998 44.2%,1.001 63.5%,1);
  --shadow:0 1px 2px rgba(15,15,25,.04),0 4px 16px rgba(15,15,25,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --row:#242426; --line:#38383a; --fg:#ffffff; --muted:#9a9aa1;
  --accent:#30d158; --accent-ink:#00210b; --accent-soft:#12321d; --accent-text:#4be07a;
  --ink:#ffffff; --on-ink:#000000;
  --hero:#1c1c1e; --on-hero:#ffffff; --on-hero-muted:#9a9aa1; --hero-row:#2c2c2e; --hero-off:#3a3a3c;
  --teal:#30d158; --teal-soft:#12321d; --good:#30d158; --warn:#ffd60a; --bad:#ff453a; --yellow-soft:#2e2812;
  --map-off:#3a3a3c; --fig:#d1d1d6; --tabbar:rgba(22,22,24,.82); --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --row:#242426; --line:#38383a; --fg:#ffffff; --muted:#9a9aa1;
  --accent:#30d158; --accent-ink:#00210b; --accent-soft:#12321d; --accent-text:#4be07a;
  --ink:#ffffff; --on-ink:#000000;
  --hero:#1c1c1e; --on-hero:#ffffff; --on-hero-muted:#9a9aa1; --hero-row:#2c2c2e; --hero-off:#3a3a3c;
  --teal:#30d158; --teal-soft:#12321d; --good:#30d158; --warn:#ffd60a; --bad:#ff453a; --yellow-soft:#2e2812;
  --map-off:#3a3a3c; --fig:#d1d1d6; --tabbar:rgba(22,22,24,.82); --shadow:none; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.2}
h1{font-size:2.125rem;letter-spacing:-.025em}
h2{font-size:1.5rem}
h3{font-size:1.125rem;letter-spacing:-.01em}
p{margin:0}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--muted)}
.lbl{font-size:.875rem;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100dvh;padding:22px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-sm);color:var(--muted);font-weight:600;transition:background-color .16s,color .16s}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--row);color:var(--fg)}
.nav button:active{transform:scale(.98)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:8px}
.sync{font-size:.875rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)}
.main{min-width:0;padding-block:30px 56px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wrap p{max-width:65ch}
@media (min-width:861px){.main{padding-left:max(36px, env(safe-area-inset-left, 0px));padding-right:max(36px, env(safe-area-inset-right, 0px))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:30;flex-direction:row;background:var(--tabbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--line);
    padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
  .brand,.side .foot{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav button{flex-direction:column;gap:3px;font-size:.6875rem;font-weight:600;padding:6px 2px;flex:1;align-items:center;border-radius:12px}
  .nav button[aria-current="page"]{background:transparent;box-shadow:none;color:var(--accent-text)}
  .nav button[aria-current="page"] svg{color:var(--accent)}
  .main{padding-block:20px 116px}
  h1{font-size:1.75rem}
}

/* Flächen */
.card{background:var(--surface);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.card.flat{background:var(--row)}
.card .card,.sheet .card,.hero-card .card{background:var(--row);box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:960px){.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.g2{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:6px}

.btn{all:unset;box-sizing:border-box;cursor:pointer;min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:600;background:var(--surface-2);color:var(--fg);text-align:center;line-height:1.2;transition:background-color .16s,transform .12s,filter .16s}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{background:var(--line)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:var(--on-ink);font-size:1rem;font-weight:700;padding:13px 24px;min-height:50px}
.btn.pri:hover{opacity:.88;background:var(--ink)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:8px 12px;font-size:.875rem;min-height:40px}
.btn.sm svg{width:15px;height:15px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{all:unset;cursor:pointer;width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:var(--r-sm);color:var(--muted);transition:background-color .16s,color .16s}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:19px;height:19px}

.chip{all:unset;cursor:pointer;min-height:40px;box-sizing:border-box;display:inline-flex;align-items:center;padding:8px 14px;border-radius:999px;background:var(--surface-2);font-size:.875rem;font-weight:600;color:var(--muted);white-space:nowrap;transition:background-color .16s,color .16s}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.subchips .chip{min-height:34px;padding:5px 12px;font-size:.8125rem;background:var(--row)}
.subchips .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.tag{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;padding:3px 9px;border-radius:var(--r-sm);font-size:.875rem;font-weight:600;background:var(--surface-2);color:var(--fg)}
.tag svg{width:13px;height:13px}
.tag.p{background:var(--accent-soft);color:var(--accent-text)}
.tag.t{background:var(--teal-soft);color:var(--teal)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.875rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=search],input[type=date],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-width:0;font-size:1rem}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transform-origin:left center}

/* Onboarding */
.ob{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.ob-hero{display:flex;gap:18px;align-items:center}
.ob-hero h1{font-size:clamp(2.5rem,6vw,3.5rem);font-weight:800;line-height:1.1;letter-spacing:-.035em}
.step-txt{font-size:.875rem;color:var(--muted);font-weight:600}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;padding:15px;border-radius:var(--r);background:var(--row);display:flex;flex-direction:column;gap:4px;min-width:0;transition:background-color .16s,transform .12s}
.opt:hover{background:var(--surface-2)}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{background:var(--surface);outline:2px solid var(--ink);outline-offset:-2px}
.opt b{font-family:var(--f-display);font-size:1rem;font-weight:600}
.opt span{font-size:1rem;color:var(--muted)}
.daypick{display:flex;gap:8px;flex-wrap:wrap}
.daypick button{all:unset;cursor:pointer;width:60px;height:60px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-weight:600;transition:background-color .16s,transform .12s}
.daypick button:hover{background:var(--surface-2)}
.daypick button:active{transform:scale(.96)}
.daypick button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.badge-rec{align-self:flex-start;font-size:.875rem;font-weight:600;color:var(--good)}

/* Heute */
.hero-card{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;background:var(--hero);color:var(--on-hero);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.hero-card h3{color:var(--on-hero)}
.hero-card .btn.ghost{background:var(--row)}
.hero-card .btn.ghost:hover{background:var(--surface-2)}
@media (max-width:960px){.hero-card{grid-template-columns:minmax(0,1fr);padding:22px;gap:22px}}
.hero-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.big{font-family:var(--f-display);font-size:clamp(2.5rem,5.5vw,4.25rem);font-weight:800;line-height:1.08;letter-spacing:-.035em;hyphens:auto;overflow-wrap:break-word;padding-top:.06em}
.eyebrow-day{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-text);font-weight:600;font-size:.875rem;padding:5px 12px;border-radius:999px}
.hero-main .sub{color:var(--on-hero-muted)}
.hero-main .row{margin-top:auto;padding-top:6px}
.goal-list{display:flex;flex-direction:column;gap:4px;margin:10px 0 0;padding:0;list-style:none}
.goal-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--hero-row);align-items:center}
.goal-list li small{display:block;color:var(--on-hero-muted);font-size:.875rem}
.goal-list li b{font-size:1rem;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--row)}
.kpi .v{font-family:var(--f-display);font-size:1.75rem;font-weight:600;font-variant-numeric:tabular-nums}
.tip{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.tip h3::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:10px;vertical-align:middle;transform:translateY(-1px)}
.tip h3{font-size:1.125rem;letter-spacing:-.01em}
.tip .src{font-size:.875rem;color:var(--muted)}
.linkcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:background-color .16s,transform .12s}
.linkcard:hover{background:var(--row)}
.linkcard:active{transform:scale(.99)}

.home-head{flex-wrap:nowrap;align-items:flex-start}
.home-head .lv{color:var(--accent-text)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.875rem;color:var(--muted)}
.week i{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.week .done i{background:var(--accent)}
.week .done i::after{content:"";width:40%;height:22%;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:translateY(-15%) rotate(-45deg)}
.week .today{color:var(--fg);font-weight:600}
.week .today i{box-shadow:inset 0 0 0 2px var(--fg)}
.streak{}
.hero-facts{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:20px;align-items:center;margin-top:6px}
.hero-map svg{width:100%;height:auto;display:block}
.hero-facts dl{margin:0;display:flex;flex-direction:column;gap:12px}
.hero-facts dt{font-size:.875rem;color:var(--on-hero-muted);font-weight:600}
.hero-facts dd{margin:0;font-size:1.25rem;font-weight:700;font-family:var(--f-display);line-height:1.25;letter-spacing:-.01em}
@media (max-width:420px){.hero-facts{grid-template-columns:120px minmax(0,1fr);gap:14px}.hero-facts dd{font-size:1rem}}
/* Ränge */
.rank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.rank{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.rank .tier{font-family:var(--f-display);font-weight:600;font-size:1.25rem}
.rank .sr{font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.emb{display:block}
.overall{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.maps{display:flex;gap:10px;justify-content:center}
.maps svg{width:100%;max-width:280px;height:auto}

.rgroups{display:flex;flex-direction:column;gap:12px}
.rgroup{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rgroup-h{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px 10px}
.rg-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.rg-name{font-weight:700;font-size:1.125rem;letter-spacing:-.01em}
.rg-tier{font-size:.875rem;color:var(--muted);font-weight:600}
.rg-chev svg{width:20px;height:20px;color:var(--muted);transition:transform .35s var(--spring)}
.rgroup.open .rg-chev svg{transform:rotate(90deg)}
.rg-pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 16px}
.rgroup.open .rg-pills{display:none}
@media (max-width:520px){.kpis{gap:8px}.kpi{padding:12px}.kpi .lbl{font-size:.8125rem}.kpi .v{font-size:1.375rem}}
.leafpill{display:inline-flex;align-items:center;gap:6px;background:var(--row);border-radius:999px;padding:4px 10px;font-size:.8125rem;white-space:nowrap}
.leafpill i{width:8px;height:8px;border-radius:50%;flex:none}
.leafpill b{font-weight:600;color:var(--muted)}
.rg-body{display:flex;flex-direction:column;gap:8px;padding:0 12px 14px;animation:appear .4s var(--ease-out) both}
.leaf{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--row);border-radius:var(--r-sm);padding:10px 12px}
.leaf-main{display:flex;flex-direction:column;gap:5px;min-width:0}
.leaf-tier{font-size:.875rem;font-weight:600;white-space:nowrap}
.leaf-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8125rem;color:var(--muted)}
.leaf-meta .ok{color:var(--accent-text);font-weight:600}
@media (max-width:520px){.leaf{grid-template-columns:auto minmax(0,1fr)}.leaf .btn{grid-column:1/-1}}
.alts{display:flex;flex-direction:column;gap:6px}
.alt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r-sm);padding:8px 12px 8px 8px;box-shadow:var(--shadow)}
.alt>svg{width:18px;height:18px;color:var(--muted)}
.alt-main{display:flex;flex-direction:column;min-width:0}
.alt-main b{font-weight:600}
.alt-main small{color:var(--muted);font-size:.8125rem}
.alt-main .other{color:var(--warn);font-weight:600}
.plan-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:10px;align-items:center}
.goalsum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.goalsum>div:first-child{display:flex;flex-direction:column}
.gs-n{font-size:2.5rem;line-height:1.05;letter-spacing:-.03em}
.gs-n small{font-size:1.25rem;color:var(--muted)}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{display:inline-flex;align-items:center;gap:5px;font-size:.8125rem;padding:4px 10px 4px 7px;border-radius:999px;background:var(--row);color:var(--muted)}
.gchip svg{width:13px;height:13px}
.gchip i{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;margin:0 2px}
.gchip.hit{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.feel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.feel{grid-template-columns:repeat(2,minmax(0,1fr))}}
.feelbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--shadow);min-width:0}
.feelbtn b{font-weight:700}
.feelbtn small{font-size:.8125rem;color:var(--muted)}
.feelbtn .dots{display:flex;gap:3px;margin-bottom:4px}
.feelbtn .dots i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.feelbtn.f1 .dots i{background:var(--bad)}.feelbtn.f2 .dots i{background:var(--warn)}
.feelbtn[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.feelbtn[aria-pressed="true"] small{color:inherit;opacity:.75}
.rpe{width:100%;accent-color:var(--accent);height:28px}
.verdict{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;background:var(--surface);box-shadow:var(--shadow)}
.verdict b{font-size:1.25rem;letter-spacing:-.01em}
.verdict.strong{background:var(--accent-soft)}.verdict.bad{background:var(--yellow-soft)}
.feelbars{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;align-items:end;height:90px}
.feelbars span{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.feelbars i{display:block;border-radius:6px 6px 3px 3px;background:var(--accent);transform-origin:bottom}
.feelbars i.f1{background:var(--bad)}.feelbars i.f2{background:var(--warn)}.feelbars i.f0{background:var(--surface-2)}
.wrap.enter .feelbars i{animation:barUp .7s var(--spring) both}
@keyframes barUp{from{transform:scaleY(0)}}
.rec{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:20px;align-items:center}
.rec-map svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.8125rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
@media (max-width:520px){.rec{grid-template-columns:110px minmax(0,1fr);gap:14px}}
.mesoblock{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.mesoblock span{display:flex;flex-direction:column;gap:5px;font-size:.75rem;color:var(--muted);text-align:center}
.mesoblock i{height:8px;border-radius:99px;background:var(--surface-2)}
.mesoblock .past i{background:var(--accent);opacity:.45}.mesoblock .now i{background:var(--accent)}.mesoblock .now{color:var(--fg);font-weight:700}
.mesoblock .dl.now i{background:var(--warn)}
.ss{box-shadow:inset 4px 0 0 var(--accent),var(--shadow)}
.ss-badge{align-self:flex-start;font-size:.8125rem;font-weight:600;color:var(--accent-text);background:var(--accent-soft);padding:4px 10px;border-radius:999px}
.warm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.warm .chip{min-height:34px;padding:5px 12px;font-size:.8125rem;background:var(--row)}
.warm .chip.on{background:var(--accent-soft);color:var(--accent-text);text-decoration:line-through}
.plates{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.875rem;background:var(--row);border-radius:var(--r-sm);padding:8px 12px}
.plate-row{display:inline-flex;align-items:center;gap:2px;height:32px;padding-left:4px;border-left:3px solid var(--muted)}
.plate{display:inline-block;width:7px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.water .glasses{display:flex;flex-wrap:wrap;gap:6px}
.water .glasses i{width:22px;height:28px;border-radius:4px 4px 8px 8px;background:var(--surface-2);transition:background-color .3s var(--ease-ios)}
.water .glasses i.full{background:#3b9cff}
.water h3{display:flex;align-items:center;gap:8px}.water h3 svg{width:18px;height:18px;color:#3b9cff}
.fav svg{width:20px;height:20px}.fav.on{color:var(--warn)}.fav.on svg{fill:currentColor}
.scan-box{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.scan-box video{width:100%;height:100%;object-fit:cover;display:block}
.scan-line{position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--bad);box-shadow:0 0 12px var(--bad)}
.season .lbl{font-weight:600}
.season-past{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.season-past span{display:flex;gap:8px;align-items:center;font-size:.8125rem;color:var(--muted)}
.season-past b{color:var(--fg);font-weight:600}
.leaf-str{font-size:.8125rem;line-height:1.4}
.measures .field label{font-size:.8125rem}
.grid.measures{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){.grid.measures{grid-template-columns:repeat(2,minmax(0,1fr))}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{all:unset;cursor:pointer;position:relative;border-radius:var(--r-sm);overflow:hidden;aspect-ratio:3/4;background:var(--row)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:.75rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.ph.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.ph-cmp{display:grid;gap:8px}.ph-cmp.two{grid-template-columns:1fr 1fr}
.ph-cmp img{width:100%;border-radius:var(--r-sm);display:block}
.ph-cmp figcaption{font-size:.875rem;color:var(--muted);margin-top:4px}
.ph-cmp figure{margin:0}
.sheet>*{flex-shrink:0}
.ex-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.ex-top .thumb{all:unset;cursor:pointer;width:64px;height:64px;border-radius:var(--r-sm);background:var(--row);display:grid;place-items:center;overflow:hidden}
.ex-top .thumb svg{width:100%;height:100%}
.linkbtn{all:unset;cursor:pointer;color:var(--accent-text);font-weight:600;font-size:.875rem;padding:6px 0;min-height:32px;display:inline-flex;align-items:center}
.fig-anim{display:flex;flex-direction:column;align-items:center;gap:4px}
.fig-anim svg{width:100%;height:auto;max-height:240px}
.fig-cap{font-size:.75rem;color:var(--muted);font-weight:600}
.guide{display:flex;flex-direction:column;gap:10px}
.guide p{line-height:1.55}
.guide-note{background:var(--accent-soft);color:var(--fg);border-radius:var(--r-sm);padding:10px 12px;font-size:.9375rem}
.guide-steps{margin:0;padding-left:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:8px}
.guide-steps li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;line-height:1.5}
.guide-steps li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:700;font-size:.8125rem;margin-top:-1px}
.guide-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.guide-cards{grid-template-columns:1fr}}
.gc{border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:4px;font-size:.9375rem;line-height:1.45}
.gc.ok{background:var(--accent-soft)}.gc.warn{background:var(--yellow-soft)}
.gc b{font-size:.8125rem}
/* Training */
.ex-card{display:flex;flex-direction:column;gap:14px}
.ex-top{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center}
.thumb{width:64px;height:64px;border-radius:var(--r-sm);background:var(--row);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:100%;height:100%}
.sugg{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r-sm);padding:12px 14px;font-size:1rem}
.sugg svg{flex:none;width:18px;height:18px;color:var(--accent-text);margin-top:2px}
.sugg b{color:var(--accent-text)}
.sets{width:100%;border-collapse:separate;border-spacing:0 4px;font-variant-numeric:tabular-nums}
.sets th{font-size:.875rem;color:var(--muted);font-weight:600;text-align:left;padding:2px 4px}
.sets td{padding:3px 4px}
.sets input{padding:9px 6px;text-align:center}
.sets .prev{font-size:.875rem;color:var(--muted);white-space:nowrap}
.sets tr td{transition:background-color .2s}
.sets tr.done td{background:var(--teal-soft)}
.sets tr.done td:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.sets tr.done td:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.check{all:unset;cursor:pointer;width:var(--tap);height:var(--tap);border-radius:var(--r-sm);background:var(--surface-2);display:grid;place-items:center;transition:background-color .16s,transform .12s}
.check:active{transform:scale(.92)}
.check svg{width:18px;height:18px;opacity:.35}
tr.done .check{background:var(--teal);color:#fff}
tr.done .check svg{opacity:1}
.wo-head{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--bg);padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wo-head .timer{font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted);font-size:1.25rem}
.rest{position:fixed;z-index:35;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);border-radius:var(--r);padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)} /* taste-skill-ignore: schwebt über dem Inhalt */
.rest .t{font-family:var(--f-display);font-size:1.75rem;font-variant-numeric:tabular-nums;min-width:64px}
.rest button{all:unset;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;padding:6px 12px;border-radius:var(--r-sm);background:rgba(127,127,127,.25);font-weight:600;font-size:.875rem}
@media (max-width:860px){.rest{bottom:calc(86px + env(safe-area-inset-bottom, 0px))}}

/* Bibliothek */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.lib-item{all:unset;box-sizing:border-box;cursor:pointer;background:var(--row);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:background-color .16s,transform .12s}
.lib-item:hover{background:var(--surface-2)}
.lib-item:active{transform:scale(.98)}
.lib-item .pics{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border-radius:var(--r-sm);padding:6px;aspect-ratio:2/1;max-width:100%}
.lib-item .pics svg{width:100%;height:100%}
.lib-item b{font-size:1rem;line-height:1.25;font-weight:600}
.lib-item small{color:var(--muted);font-size:.875rem}

/* Ernährung */
.ring-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center}
@media (max-width:520px){.ring-wrap{grid-template-columns:minmax(0,1fr);justify-items:center}}
.macro{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:1rem}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 6px 8px 12px;border-radius:var(--r-sm);background:var(--row);margin-top:6px}
.entry small{color:var(--muted);display:block;font-size:.875rem}
.food-res{display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow:auto}
.food-res button{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--row);transition:background-color .16s}
.food-res button:hover{background:var(--surface-2)}
.food-res button[aria-pressed="true"]{background:var(--accent-soft)}
.food-res small{color:var(--muted);font-size:.875rem}
.off-box{display:flex;flex-direction:column;gap:12px;border-radius:var(--r);padding:14px;background:var(--row)}
.off-box .food-res button{background:var(--surface)}
.off-box .food-res button:hover{background:var(--surface-2)}
.off-box .food-res button[aria-pressed="true"]{background:var(--accent-soft)}
.off-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto auto;gap:8px;align-items:end}
@media (max-width:620px){.off-form{grid-template-columns:minmax(0,1fr)}}
.off-note{font-size:.875rem;color:var(--muted);margin:0}
.off-err{font-size:1rem;color:var(--bad);margin:0}
.off-cta{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--teal-soft);color:var(--teal);font-weight:600;font-size:1rem;transition:filter .16s}
.off-cta:hover{filter:brightness(.97)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--bg);border-radius:20px;width:100%;max-width:620px;max-height:88vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
@media (max-width:620px){.overlay{align-items:flex-end;padding:0}.sheet{border-radius:22px 22px 0 0;max-height:92vh;padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}}
.toast{position:fixed;z-index:60;top:calc(10px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3)} /* taste-skill-ignore: schwebt */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:12px 16px;font-size:1rem}
.chart-box{overflow-x:auto}
.chart-box svg{width:100%;min-width:320px;height:auto;display:block}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--row);border-radius:var(--r)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist details{background:var(--row);border-radius:var(--r-sm);padding:12px 14px}
.hist summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;list-style:none}
.hist summary::-webkit-details-marker{display:none}
.vol{display:grid;grid-template-columns:120px minmax(0,1fr) 42px;gap:10px;align-items:center;font-size:1rem}
.vol .track{position:relative;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.vol .zone{position:absolute;top:0;bottom:0;background:var(--teal-soft)}
.vol .fill{position:absolute;top:3px;bottom:3px;left:0;border-radius:4px;background:var(--accent);transform-origin:left center}
.rankup{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--r);background:var(--accent-soft)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fig-big{background:var(--row);border-radius:var(--r);display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.fig-big svg{width:100%;height:auto;max-height:220px}
.recent-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--row);flex-wrap:nowrap}

/* Bewegung im Apple-Stil: Federkurven, kurze Wege, nur Transform und Opacity.
   Tabwechsel: Inhalte erscheinen gestaffelt. Sheets gleiten hoch, die Seite dahinter tritt zurück.
   Große Titel weichen beim Scrollen einer kompakten Leiste. Reduzierte Bewegung schaltet alles ab. */
@supports not (animation-timing-function:linear(0,1)){:root{--spring:cubic-bezier(.34,1.36,.64,1)}}
@keyframes appear{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ringIn{from{stroke-dashoffset:var(--C)}}
@keyframes popIn{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes climb{0%{transform:translateY(16px) scale(.85);opacity:0}100%{transform:none;opacity:1}}
@keyframes tabPop{0%{transform:scale(1)}30%{transform:scale(.78)}100%{transform:scale(1)}}
@keyframes checkPop{0%{transform:scale(.3);opacity:.2}100%{transform:scale(1);opacity:1}}
@keyframes rowFlash{from{background:var(--accent-soft)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
@keyframes island{0%{opacity:0;transform:translateX(-50%) translateY(-6px) scale(.55,.7)}100%{opacity:1;transform:translateX(-50%)}}
@keyframes sheen{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(320%) skewX(-18deg)}}
.wrap.enter>*{animation:appear .55s var(--ease-out) both;animation-delay:calc(var(--i,0)*45ms)}
.wrap.enter .grid>*,.wrap.enter .goal-list li,.wrap.enter .rank-grid>.card,.wrap.enter .lib>*{animation:appear .5s var(--ease-out) both;animation-delay:calc(120ms + var(--j,0)*40ms)}
.wrap.enter .bar>i,.wrap.enter .vol .fill{animation:grow 1s var(--ease-ios) .2s both}
.ring-arc{transition:stroke-dashoffset .8s var(--ease-ios)}
.wrap.enter .ring-arc{animation:ringIn 1.2s var(--ease-ios) .15s both}
.wrap.enter .week span i{animation:popIn .5s var(--spring) both}
.wrap.enter .week span:nth-child(1) i{animation-delay:.25s}.wrap.enter .week span:nth-child(2) i{animation-delay:.29s}.wrap.enter .week span:nth-child(3) i{animation-delay:.33s}.wrap.enter .week span:nth-child(4) i{animation-delay:.37s}.wrap.enter .week span:nth-child(5) i{animation-delay:.41s}.wrap.enter .week span:nth-child(6) i{animation-delay:.45s}.wrap.enter .week span:nth-child(7) i{animation-delay:.49s}
.wrap.enter .rank-grid>.card .emb,.wrap.enter .overall .emb{animation:climb .7s var(--spring) both;animation-delay:calc(180ms + var(--j,0)*40ms)}
.wrap.enter .hero-map ellipse,.wrap.enter .hero-map rect,.wrap.enter .hero-map path{animation:fadeIn .8s var(--ease-ios) .3s both}
.nav.bump button[aria-current="page"] svg{animation:tabPop .45s var(--spring)}
/* Druck-Feedback wie bei iOS: kurz eindrücken, federnd zurück */
.btn,.chip,.linkcard,.opt,.lib-item,.check,.icon-btn,.daypick button,.food-res button,.nav button{transition:transform .35s var(--spring),background-color .2s,opacity .2s,box-shadow .2s}
.btn:active,.chip:active,.linkcard:active,.opt:active,.lib-item:active,.daypick button:active,.food-res button:active{transform:scale(.96);transition-duration:.1s}
.check:active,.icon-btn:active{transform:scale(.88);transition-duration:.1s}
.nav button:active{transform:scale(.92);transition-duration:.1s}
tr.done .check svg{animation:checkPop .5s var(--spring)}
.sets tr.done td{animation:rowFlash .6s var(--ease-ios)}
/* Sheets */
.overlay{animation:fadeIn .3s var(--ease-ios) both}
.sheet{animation:sheetIn .45s var(--ease-ios) both}
@media (max-width:620px){.sheet{animation:sheetUp .5s var(--ease-ios) both}}
.overlay.closing{animation:fadeIn .26s cubic-bezier(.4,0,1,1) reverse both}
.overlay.closing .sheet{animation:sheetIn .26s cubic-bezier(.4,0,1,1) reverse both}
@media (max-width:620px){.overlay.closing .sheet{animation:sheetUp .3s cubic-bezier(.4,0,1,1) reverse both}}
@media (max-width:620px){
  .main{transition:transform .5s var(--ease-ios),border-radius .5s var(--ease-ios),filter .5s var(--ease-ios);transform-origin:50% var(--sheet-origin,50vh)}
  body.sheet-open .main{transform:scale(.93);border-radius:16px;filter:brightness(.92);overflow:hidden}
}
/* Kompakte Titelleiste beim Scrollen */

 lunge:['Steh aufrecht, Kurzhanteln seitlich.','Mach einen großen Schritt nach vorn.|Senke das hintere Knie Richtung Boden, das vordere Knie bleibt über dem Fuß.|Drück dich über die vordere Ferse zurück.','Oberkörper leicht vorlehnen betont das Gesäß.','Das vordere Knie knickt nach innen.'],
 stepup:['Stell eine Box oder Bank auf etwa Kniehöhe.','Setz einen Fuß komplett auf die Box.|Drück dich über das vordere Bein hoch, das hintere Bein hilft kaum mit.|Steig kontrolliert zurück.','Je höher die Box, desto mehr Gesäß.','Mit dem hinteren Bein abspringen.'],
 rdl:['Stange in den Händen, Füße hüftbreit, Knie leicht gebeugt.','Schieb die Hüfte nach hinten, die Stange gleitet an den Oberschenkeln entlang.|Rücken gerade, bis du die Beinbeuger deutlich spürst, meist knapp unter dem Knie.|Schieb die Hüfte nach vorn und richte dich auf.','Die Bewegung kommt aus der Hüfte, nicht aus dem Rücken.','Runder Rücken oder zu stark gebeugte Knie, dann wird es eine Kniebeuge.'],
 legcurl:['Bauchlage, Polster über den Fersen, Knie knapp über der Polsterkante.','Drück die Hüfte ins Polster.|Zieh die Fersen zum Gesäß.|Lass langsam zurück.','Das langsame Ablassen ist der wichtigste Teil.','Die Hüfte hebt ab.'],
 nordic:['Knie dich hin, Fersen fest fixiert (Partner, Bank oder Gerät).','Körper von Knie bis Kopf gerade.|Lass dich so langsam wie möglich nach vorn fallen, die Beinbeuger bremsen.|Fang dich mit den Händen ab und drück dich leicht zurück.','Schon die langsame Absenkphase ist sehr wirksam gegen Verletzungen.','In der Hüfte einknicken.'],
 hipthrust:['Oberer Rücken an der Bankkante, Stange mit Polster in der Hüftbeuge, Füße hüftbreit.','Nimm das Kinn leicht zur Brust.|Drück die Hüfte hoch, bis Schultern, Hüfte und Knie eine Linie bilden.|Spann oben das Gesäß an und senke langsam ab.','Die Schienbeine sind oben etwa senkrecht.','Ins Hohlkreuz gehen statt die Hüfte zu strecken.'],

 swing:['Kettlebell vor dir, Füße schulterbreit.','Schieb die Hüfte nach hinten und schwing die Kettlebell zwischen den Beinen nach hinten.|Streck die Hüfte explosiv, die Kettlebell schwingt bis Brusthöhe.|Die Arme sind nur Seile, die Kraft kommt aus der Hüfte.','Oben kurz Gesäß und Bauch anspannen.','Eine Kniebeuge statt Hüftbeuge machen oder mit den Armen heben.'],
 calf:['Fußballen auf einer Kante, Fersen frei.','Senke die Fersen so tief wie möglich.|Drück dich hoch auf die Zehenspitzen und halte oben 1 Sekunde.|Lass langsam ab.','Volle Bewegungsweite, unten kurz dehnen.','Wippen mit kleinem Bewegungsweg.'],

 abwheel:['Knie dich hin, das Rad unter den Schultern.','Spann den Bauch an und roll das Rad langsam nach vorn.|So weit, wie du den Rücken gerade halten kannst.|Roll mit Bauchspannung zurück.','Am Anfang nur ein kurzes Stück rollen.','Ins Hohlkreuz fallen.'],
 clean:['Stange vor den Schienbeinen, Startposition wie beim Kreuzheben.','Zieh die Stange bis über die Knie.|Streck die Hüfte explosiv und zieh die Schultern hoch.|Tauch unter die Stange und fang sie vorn auf den Schultern, Ellbogen hoch.','Technikübung: leichte Gewichte, am besten mit Coach lernen.','Mit den Armen ziehen.'],
 run:['Lauf locker und aufrecht, die Arme schwingen mit.','Starte mit lockerem Tempo.|Du solltest dich noch unterhalten können (Zone 2).|Steigere den Umfang langsam, etwa 10 % pro Woche.','Der Fuß landet unter dem Körper, nicht weit vorn.','Zu schnell starten.'],
 bike:['Stell den Sattel so hoch, dass das Knie unten leicht gebeugt bleibt.','Tritt gleichmäßig mit 80–90 Umdrehungen pro Minute.|Wähl den Widerstand so, dass du noch sprechen kannst.|Für Intervalle kurze schwere Abschnitte einbauen.','Oberkörper locker, Schultern unten.','Sattel zu tief, das belastet die Knie.'],
 stretch:['Geh in einen Ausfallschritt, das hintere Knie am Boden.','Spann das Gesäß an.|Schieb die Hüfte nach vorn, bis du vorn in der Hüfte eine Dehnung spürst.|Halte 30–60 s je Seite und atme ruhig.','Dehnen nach dem Training oder an Ruhetagen.','Ins Hohlkreuz ausweichen.'],
 deepsquat:['Geh tief in die Hocke, Fersen am Boden.','Drück die Knie mit den Ellbogen leicht nach außen.|Halte den Oberkörper aufrecht.|Bleib 30–60 s und atme ruhig.','Halt dich anfangs an etwas fest, wenn die Fersen abheben.','Mit rundem Rücken zusammensacken.'],
 quad:['Starte im Vierfüßlerstand oder in der Position der Übung.','Geh langsam in die Dehnung.|Atme ruhig und lass mit jedem Ausatmen etwas nach.|Halte 30–60 s oder wiederhole die Bewegung langsam.','Dehnen soll ziehen, nicht schmerzen.','Ruckartig in die Endposition gehen.']
};

function guideFor(id){
 const ex=EX[id]; if(!ex) return null;
 const base=GUIDE_P[ex.pat]||GUIDE_P.quad, x=GUIDE_X[id];
 const g={setup:base[0],steps:base[1].split('|'),tip:base[2],mistake:base[3],note:''};
 if(typeof x==='string') g.note=x;
 else if(Array.isArray(x)){ if(x[0]) g.setup=x[0]; if(x[1]) g.steps=x[1].split('|'); if(x[2]) g.tip=x[2]; if(x[3]) g.mistake=x[3]; }
 if(ex.custom) g.note='Eigene Übung: Die Anleitung zeigt das Grundmuster der gewählten Bewegung.';
 return g;
}

 }

const TIERS=[
 {n:'Eisen',min:0,c1:'#a7adb5',c2:'#4d535c'},{n:'Bronze',min:150,c1:'#e7a873',c2:'#8a4f22'},{n:'Silber',min:400,c1:'#eef2f7',c2:'#7b8898'},
 {n:'Gold',min:800,c1:'#ffe28f',c2:'#b7842a'},{n:'Platin',min:1400,c1:'#a8f2e6',c2:'#278a82'},{n:'Diamant',min:2300,c1:'#c2dbff',c2:'#3a6ad3'},
 {n:'Meister',min:3600,c1:'#e5c9ff',c2:'#7642c4'},{n:'Großmeister',min:5200,c1:'#ffbcc1',c2:'#bf3046'},{n:'Legende',min:7500,c1:'#fff3c2',c2:'#de861b'}
];
const DIVS=['I','II','III'];
function tierOf(sr){
 let i=0; for(let k=0;k<TIERS.length;k++) if(sr>=TIERS[k].min) i=k;
 const t=TIERS[i], nx=TIERS[i+1];
 if(!nx) return {i,t,div:'',label:t.n,next:null,prog:1,toNext:0};
 const span=(nx.min-t.min)/3; const step=Math.min(2,Math.floor((sr-t.min)/span));
 const divNum=3-step; const lo=t.min+step*span, hi=lo+span;
 return {i,t,div:DIVS[divNum-1],divNum,label:`${t.n} ${DIVS[divNum-1]}`,prog:(sr-lo)/span,toNext:Math.ceil(hi-sr),nextLabel:divNum===1?`${nx.n} III`:`${t.n} ${DIVS[divNum-2]}`};
}
function emblem(sr,size=56){
 const r=tierOf(sr), t=r.t, i=r.i;
 const pips=r.divNum?4-r.divNum:0;
 let pipS=''; for(let k=0;k<pips;k++){const x=32+(k-(pips-1)/2)*9;pipS+=`<path d="M${x} 54l3 3-3 3-3-3z" fill="#fff" fill-opacity=".9"/>`}
 const glyph=i>=8?'<path d="M32 18l4 9 10 1-8 6 3 10-9-6-9 6 3-10-8-6 10-1z" fill="#fff" fill-opacity=".92"/>'
  :i>=5?'<path d="M32 17l11 11-11 17-11-17z" fill="#fff" fill-opacity=".85"/><path d="M21 28h22" stroke="'+t.c2+'" stroke-width="1.5"/>'
  :`<g stroke="#fff" stroke-opacity=".9" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">${Array.from({length:Math.min(3,i+1)},(_,k)=>`<path d="M23 ${38-k*7}l9-7 9 7"/>`).join('')}</g>`;
 return `<svg viewBox="0 0 64 72" width="${size}" height="${Math.round(size*72/64)}" class="emb" role="img" aria-label="${esc(r.label)}"><defs><linearGradient id="tg${i}" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="${t.c1}"/><stop offset="1" stop-color="${t.c2}"/></linearGradient></defs><path d="M32 3L59 15v31c0 13-12 20-27 24C17 66 5 59 5 46V15z" fill="url(#tg${i})" stroke="${t.c2}" stroke-width="2"/><path d="M32 10L52 19v26c0 9-8 15-20 18-12-3-20-9-20-18V19z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.4"/>${glyph}${pipS}</svg>`;
}

const OFF_HOST='host:claude_browser';
const OFF_FIELDS='code,product_name,product_name_de,brands,quantity,serving_quantity,nutriments';
let MCP=null, OFFTAB=null;
const STANDALONE=!!window.IRON_STANDALONE;
const offAvailable=()=>STANDALONE||!!MCP;
const toolText=res=>{ const t=(res&&res.content||[]).filter(b=>b&&b.type==='text').map(b=>b.text).join('\n'); if(t) return t; const p=res&&res.payload; return typeof p==='string'?p:JSON.stringify(p||''); };
function offUrl(brand,q){
 const clean=s=>s.replace(/["\\:()\[\]{}^~*?!\/+\-|<>=]/g,' ').replace(/\s+/g,' ').trim();
 const b=clean(brand||''), t=clean(q||''); const parts=[];
 if(/^\d{8,14}$/.test(t)) parts.push('code:'+t);
 else { if(b) parts.push(`brands:"${b}"`); if(t) parts.push(t); }
 const sort=b||/^\d+$/.test(t)?'&sort_by=-unique_scans_n':'';
 return `https://search.openfoodfacts.org/search?q=${encodeURIComponent(parts.join(' AND '))}&page_size=25&langs=de${sort}&fields=${OFF_FIELDS}`;
}
function offParse(text){
 const i=text.indexOf('{"hits"');
 if(i<0){ if(/temporarily unavailable|nicht verfügbar|503|502/i.test(text)) throw {code:'off_down'}; throw {code:'off_parse'}; }
 let s=text.slice(i); const cut=s.indexOf('\nTab Context'); if(cut>0) s=s.slice(0,cut); s=s.slice(0,s.lastIndexOf('}')+1);
 return offMap(JSON.parse(s).hits);
}
function offMap(list){
 return (list||[]).map(h=>{
  const n=h.nutriments||{}; let k=n['energy-kcal_100g'];
  if(k==null){ const kj=n['energy-kj_100g']??n['energy_100g']; if(kj!=null) k=kj/4.184; }
  const brands=[...new Set((Array.isArray(h.brands)?h.brands:String(h.brands||'').split(',')).map(x=>String(x).trim()).filter(Boolean))];
  const qm=String(h.quantity||'').match(/([\d.,]+)\s*(g|ml)\b/i); const qty=qm?num(qm[1]):0;
  const sv=num(h.serving_quantity);
  const por=sv>0&&sv<=1000?sv:qty>0&&qty<=500?qty:100;
  const pl=sv>0&&sv<=1000?'Portion':qty>0&&qty<=500?'Packung':'Portion';
  const name=(h.product_name_de||h.product_name||'').trim();
  return {id:'off-'+h.code,code:h.code,n:name?(brands[0]&&!name.toLowerCase().includes(brands[0].toLowerCase())?brands[0]+' – '+name:name):(brands[0]||'Unbenanntes Produkt'),
   brand:brands.join(', '),qty:h.quantity||'',k:k==null?null:+k,p:num(n.proteins_100g),c:num(n.carbohydrates_100g),f:num(n.fat_100g),por,pl,cat:'Marke',off:true};
 });
}
async function offCall(tool,input){ return MCP.callTool(OFF_HOST,tool,input,{cache:false}); }
async function offDirect(brand,q){
 const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),15000);
 try{
  const r=await fetch(offUrl(brand,q),{signal:ctl.signal});
  if(!r.ok) throw {code:r.status>=500?'off_down':'off_parse'};
  return offMap((await r.json()).hits);
 }catch(e){
  if(e&&e.code==='off_down') throw e;
  const t2=String(q||'').trim();
  const url=/^\d{8,14}$/.test(t2)
   ?`https://world.openfoodfacts.org/api/v2/product/${t2}.json?fields=${OFF_FIELDS}`
   :`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent((brand+' '+q).trim())}&search_simple=1&json=1&page_size=25&sort_by=unique_scans_n&fields=${OFF_FIELDS}`;
  const r=await fetch(url); if(!r.ok) throw {code:'off_down'};
  const d=await r.json(); return offMap(d.product?[d.product]:d.products);
 }finally{clearTimeout(t)}
}
async function offFetch(url){

 if(!OFFTAB){ const r=await offCall('preview_start',{url}); const m=toolText(r).match(/"?tabId"?\s*[:=]?\s*"?([\w-]+)"?/); OFFTAB=m?m[1]:null; }
 const r=await offCall('get_page_text',OFFTAB?{tabId:OFFTAB,max_chars:120000}:{max_chars:120000});
 return offParse(toolText(r));
}

  cancelled:'Suche abgebrochen.',

  off_parse:STANDALONE?'Open Food Facts hat nicht geantwortet. Prüf deine Internetverbindung und such nochmal.':'Die Antwort von Open Food Facts war unvollständig. Bitte nochmal suchen. Falls der Browser nach einer Freigabe für search.openfoodfacts.org fragt, erlaube sie.',
  server_unavailable:'Der App-Browser antwortet gerade nicht. Versuch es gleich nochmal.',
 }[c]||('Suche fehlgeschlagen'+(e&&e.message?': '+e.message:'.'));
}
async function offSearch(){
 const o=FS.off; if(o.busy) return;
 if(!o.brand.trim()&&!o.q.trim()){ o.err='Gib eine Marke, ein Produkt oder einen Barcode ein.'; drawOff(); return; }
 if(!offAvailable()){ o.err=offErrorText({code:'server_not_connected'}); drawOff(); return; }
 o.busy=true; o.err=''; drawOff();

 o.busy=false; drawOff();

/* ============ Berechnungen ============ */
function calcTargets(p){
 const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
 const tdee=bmr*p.activity; const g=GOALS[p.goal];
 const kcal=Math.round((tdee+g.kcal)/10)*10, prot=Math.round(p.weight*g.prot), fat=Math.round(p.weight*0.9);
 return {kcal,p:prot,f:fat,c:Math.max(0,Math.round((kcal-prot*4-fat*9)/4)),tdee:Math.round(tdee)};
}
function repRange(ex){
 const g=S.profile?.goal||'muscle', c=ex.comp;
 return {muscle:c?[6,10]:[10,15],strength:c?[3,6]:[8,12],fatloss:c?[6,10]:[10,15],mobility:c?[8,12]:[12,15],fitness:c?[10,15]:[12,20]}[g];
}
const baseSets=ex=>ex.kind==='c'?1:(S.profile?.goal==='strength'&&ex.comp)?4:3;
/* Trainingsblock (Mesozyklus): Woche 1–2 Aufbau, ab Woche 3 +1 Satz, letzte Woche Deload */
function mesoInfo(){
 if(!S.profile) return {week:1,len:5,deload:false,phase:'Aufbau'};
 const m=S.profile.meso||(S.profile.meso={start:weekKey(today()),len:5});
 const len=m.len||5; const wk=Math.round((new Date(weekKey(today())+'T12:00:00')-new Date(m.start+'T12:00:00'))/(7*864e5));
 const i=((wk%len)+len)%len; const deload=i===len-1;
 return {week:i+1,len,deload,phase:deload?'Deload':i<2?'Aufbau':'Steigerung'};
}
const setCount=ex=>{ const b=baseSets(ex); if(ex.kind==='c'||ex.kind==='t'||!S.profile) return b; const mi=mesoInfo(); return mi.deload?Math.max(1,Math.ceil(b/2)):b+(mi.week>=3?1:0); };
function deloadAdvice(){
 const rated=sortedW().filter(w=>w.rating&&!w.deload).slice(-2);
 return rated.length===2&&rated.every(w=>w.rating.feel<=2)&&!mesoInfo().deload;
}
const restSec=ex=>{const g=S.profile?.goal; if(ex.kind==='t') return 45; return g==='strength'?(ex.comp?180:120):g==='muscle'||g==='fatloss'?(ex.comp?150:90):(ex.comp?90:60)};
const incOf=ex=>ex.comp?(LOWER.has(ex.pat)?5:2.5):(ex.eq==='KH'?2:ex.eq==='KB'||ex.eq==='MA'?2.5:1.25);
const bw=()=>S.profile?.weight||75;
function setScore(ex,s){
 if(ex.kind==='t') return num(s.r); if(ex.kind==='c') return num(s.r);
 const w=ex.kind==='bw'?bw()+num(s.w):num(s.w), r=num(s.r);
 if(r<=0) return 0; return r===1?w:w*(1+Math.min(r,15)/30);
}
const e1rm=(w,r)=>r<=1?w:w*(1+Math.min(r,15)/30);
const sortedW=()=>[...S.workouts].sort((a,b)=>(a.date+String(a.ts)).localeCompare(b.date+String(b.ts)));
const FEELS=[{n:'Schlecht',d:'Kraftlos, kaum etwas lief'},{n:'Mittel',d:'Ging so, eher zäh'},{n:'Gut',d:'Solide Einheit'},{n:'Sehr gut',d:'Stark, alles lief'}];
const FACTORS=['Wenig Schlaf','Wenig gegessen','Stress','Schmerzen','Wenig Zeit','Viel Energie','Guter Pump','Neue Technik'];
const BAD_FACTORS=['Wenig Schlaf','Wenig gegessen','Stress','Schmerzen','Wenig Zeit'];
const isBadDay=r=>!!r&&(r.feel===1||(r.feel===2&&(r.tags||[]).some(t=>BAD_FACTORS.includes(t))));
function history(exId){ const out=[]; for(const w of sortedW()){const it=w.items.find(i=>i.ex===exId); if(it&&it.sets.length) out.push({date:w.date,sets:it.sets,best:Math.max(...it.sets.map(s=>setScore(EX[exId],s))),feel:w.rating?.feel||0,bad:isBadDay(w.rating),deload:!!w.deload})} return out; }
function goalEval(d){
 const list=[]; for(const it of d.items){ const ex=EX[it.ex]; const done=it.sets.filter(x=>x.done&&num(x.r)>0); if(!ex||!done.length) continue;
  const t=it.sugg||{n:done.length,w:0,r:0};
  const ok=x=>num(x.r)>=num(t.r)&&((ex.kind==='w'||ex.kind==='bw')&&t.w?num(x.w)>=num(t.w)-1e-9:true);
  list.push({id:it.ex,hit:done.length>=t.n&&done.every(ok)}); }
 return {hit:list.filter(x=>x.hit).length,total:list.length,list};
}
function verdict(g,r){
 const q=g.total?g.hit/g.total:0, f=r?.feel||0, tags=r?.tags||[];
 const why=tags.filter(t=>BAD_FACTORS.includes(t));
 const note=why.includes('Wenig Schlaf')?' Schlaf gehört zu den stärksten Einflüssen auf Kraftleistung.':why.includes('Wenig gegessen')?' Mit wenig Energie im Tank sinkt die Leistung spürbar.':'';
 if(!f) return q>=.8?{k:'strong',n:'Stark',t:'Fast alle Ziele erreicht.'}:q>=.5?{k:'ok',n:'Solide',t:'Ein Großteil der Ziele sitzt.'}:{k:'low',n:'Unter Plan',t:'Weniger als die Hälfte der Ziele erreicht.'};
 if(q>=.8&&f>=3) return {k:'strong',n:'Stark',t:'Ziele erreicht und es hat sich gut angefühlt. Beim nächsten Mal steigen die Ziele.'};
 if(q>=.8) return {k:'strong',n:'Stark trotz Gegenwind',t:'Objektiv hast du deine Ziele erreicht, auch wenn es sich schwer anfühlte.'+note};
 if(q<.5&&f<=2) return {k:'bad',n:'Schwacher Tag',t:'Ein schlechter Tag ist kein Rückschritt. Deine Ziele bleiben beim nächsten Mal stabil, statt zu sinken.'+note};
 if(q<.5) return {k:'low',n:'Gefühl gut, Ziele verfehlt',t:'Die Gewichte waren vermutlich zu hoch angesetzt. Achte beim nächsten Mal auf 1–3 Wiederholungen in Reserve.'};
 return {k:'ok',n:'Solide',t:f>=3?'Ein Großteil der Ziele sitzt, und es lief gut.':'Ein Großteil der Ziele sitzt, obwohl es zäh war.'+note};
}
function lastPerf(exId){ const h=history(exId); return h[h.length-1]||null; }

function suggestion(exId){
 const s=suggestionBase(exId); const ex=EX[exId]; if(!s||!ex) return s;
 if(mesoInfo().deload&&ex.kind==='w'&&s.w>0){ s.w=r05(s.w*.9); s.head=`${fmt(s.w,2)} kg × ${s.r}`; s.text='Deload-Woche: halbe Sätze, 10 % leichter, 3–4 Wdh. in Reserve. '+s.text; s.why='Deload: Ermüdung abbauen, Fortschritt sichern'; }
 return s;
}
function suggestionBase(exId){
 const ex=EX[exId]; if(!ex) return null;
 const h0=history(exId); const hd=h0.filter(x=>!x.deload);
 const [lo,hi]=repRange(ex), n=setCount(ex), h=hd.length?hd:h0, last=h[h.length-1];
 if(ex.kind==='t'){ const b=last?Math.max(...last.sets.map(s=>num(s.r))):0, t=last?b+5:30;

/* Ranglogik: aus allen Trainings neu berechnet. Pro Unterkategorie zählen bis zu 15 Sätze pro Woche,
   ab 6 Sätzen gibt es den Wochenbonus (2–3 Unterkategorien × 6 ≈ 10–20 Sätze pro Muskel, Schoenfeld et al. 2017). */
const WEEK_CAP=15, WEEK_BONUS=6;
const groupSR=(sr,gk)=>{const l=leavesOf(gk); return l.reduce((a,m)=>a+sr[m],0)/l.length};
const overallSR=sr=>GROUPS.reduce((a,g)=>a+groupSR(sr,g.k),0)/GROUPS.length;
function weekGroupSets(wk){ const out={}; GROUPS.forEach(g=>out[g.k]=0);
 for(const w of S.workouts){ if(weekKey(w.date)!==wk) continue; for(const it of w.items){const ex=EX[it.ex]; if(!ex) continue; const n=it.sets.filter(s=>num(s.r)>0).length;
  const pg=PARENT[ex.prim]; out[pg]+=n; [...new Set(ex.sec.map(m=>PARENT[m]))].filter(g=>g!==pg).forEach(g=>out[g]+=n*.5)} }
 return out; }
function computeRanks(list){
 const ws=(list||sortedW()); const sr={}; MKEYS.forEach(m=>sr[m]=0);
 const week={}, best={}, gains={}, prs={};
 for(const w of ws){
  const wk=weekKey(w.date); const g={}; const add=(m,v)=>{sr[m]+=v;g[m]=(g[m]||0)+v};
  prs[w.id]=[];
  for(const it of w.items){
   const ex=EX[it.ex]; if(!ex||!it.sets.length) continue;
   for(const s of it.sets){
    if(num(s.r)<=0) continue;
    const credit=ex.kind==='c'?Math.min(3,Math.floor(num(s.r)/10)):1;
    for(let c=0;c<credit;c++){
     const k=wk+ex.prim; week[k]=(week[k]||0)+1;
     if(week[k]<=WEEK_CAP) add(ex.prim,10);

     ex.sec.forEach(m=>{const k2=wk+m; const was=week[k2]||0; week[k2]=was+.5; if(week[k2]<=WEEK_CAP) add(m,4); if(was<WEEK_BONUS&&week[k2]>=WEEK_BONUS) add(m,30)});

   else if(sc>best[it.ex]*1.001){ best[it.ex]=sc; add(ex.prim,25); ex.sec.forEach(m=>add(m,8)); prs[w.id].push(it.ex); }

}
function weekSets(wk){ const out={}; MKEYS.forEach(m=>out[m]=0);
 for(const w of S.workouts){ if(weekKey(w.date)!==wk) continue; for(const it of w.items){const ex=EX[it.ex]; if(!ex) continue; const n=it.sets.filter(s=>num(s.r)>0).length; out[ex.prim]+=n; ex.sec.forEach(m=>out[m]+=n*.5)} }

/* Erholung: Ermüdung pro Unterkategorie aus den letzten 5 Tagen (Halbwertszeit 28–36 h) */
const BIG=new Set(['quads','hams','glutes','lower','lats','upback','chest_mid']);

 for(const w of S.workouts){ const t=w.end||new Date(w.date+'T18:00:00').getTime(); const hrs=(now-t)/36e5; if(hrs<0||hrs>120) continue;
  const k=(w.rating&&w.rating.rpe>=9)?1.2:1;
  for(const it of w.items){ const ex=EX[it.ex]; if(!ex||ex.kind==='t') continue; const n=it.sets.length*(ex.kind==='c'?.3:1);
   const add=(m,x)=>{ f[m]+=x*k*Math.pow(.5,hrs/(BIG.has(m)?36:28)); }; add(ex.prim,n); ex.sec.forEach(m=>add(m,n*.5)); } }

}

/* Kraftstandards: bestes geschätztes 1RM im Verhältnis zum Körpergewicht (Richtwerte für Männer, Frauen ≈ 65 %) */
const STD={

const STD_N=['Einsteiger','Anfänger','Fortgeschritten','Erfahren','Elite'];
const STD_SR=[60,250,500,850,1300];
const STD_BY_LEAF={}; Object.entries(STD).forEach(([id,st])=>STD_BY_LEAF[st.leaf]=id);
function strengthMap(){
 const out={}; if(!S.profile) return out; const bw=S.profile.weight||75, fem=S.profile.sex==='w';
 for(const [id,st] of Object.entries(STD)){ if(!EX[id]) continue; const h=history(id); if(!h.length) continue;
  const best=Math.max(...h.map(x=>x.best)), ratio=best/bw;
  const r=st.r.map(x=>fem?(st.bw?1+(x-1)*.6:x*.65):x);
  let sr, lvl=-1;
  if(ratio<r[0]) sr=STD_SR[0]*Math.max(0,ratio/r[0]);
  else { lvl=0; for(let i=1;i<r.length;i++) if(ratio>=r[i]) lvl=i;

  out[st.leaf]={id,ratio,lvl,sr:Math.round(sr),next:lvl<4?r[lvl+1]:null};

/* Adaptiver Kalorienbedarf: Ø Aufnahme minus Gewichtsänderung × 7.700 kcal/kg (letzte 28 Tage) */
function adaptiveTDEE(){
 const days=[]; for(let i=1;i<=28;i++){ const d=addDays(today(),-i); const k=dayTotals(d).k; if(k>600) days.push(k); }
 const ws=Object.entries(S.profile.weights||{}).filter(([d])=>d>=addDays(today(),-28)&&d<=today()).sort((a,b)=>a[0].localeCompare(b[0]));
 if(days.length<10||ws.length<3) return {ok:false,days:days.length,weights:ws.length};
 const t0=new Date(ws[0][0]+'T12:00:00').getTime(); const xs=ws.map(([d])=>(new Date(d+'T12:00:00').getTime()-t0)/864e5), ys=ws.map(([,v])=>+v);
 const mx=xs.reduce((a,b)=>a+b,0)/xs.length, my=ys.reduce((a,b)=>a+b,0)/ys.length;
 const den=xs.reduce((a,x)=>a+(x-mx)**2,0); const slope=den?xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/den:0;
 const intake=days.reduce((a,b)=>a+b,0)/days.length;
 return {ok:true,tdee:Math.round((intake-slope*7700)/10)*10,intake:Math.round(intake),perWeek:slope*7,days:days.length};
}

const ZX_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';
let ZX_P=null, SCAN_READER=null, SCAN_STREAM=null;
function loadZX(){ if(window.ZXing) return Promise.resolve(window.ZXing); if(ZX_P) return ZX_P; ZX_P=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=ZX_URL; sc.onload=()=>window.ZXing?res(window.ZXing):rej(new Error('ZXing fehlt')); sc.onerror=()=>{ZX_P=null; rej(new Error('Scanner konnte nicht geladen werden'))}; document.head.appendChild(sc); }); return ZX_P; }
function zxReaderClass(Z){ if(Z.BrowserMultiFormatReader) return Z.BrowserMultiFormatReader; const c=Object.values(Z).filter(v=>typeof v==='function'&&v.prototype&&v.prototype.decodeFromImageUrl&&v.prototype.decodeFromVideoDevice); return c.find(v=>/MultiFormat/.test(v.name))||c[0]; }
async function decodeImageFile(file){
 if('BarcodeDetector' in window){ try{ const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); const bmp=await createImageBitmap(file); const r=await det.detect(bmp); if(r[0]) return r[0].rawValue; }catch(e){} }
 const Z=await loadZX(); const C=zxReaderClass(Z); const url=URL.createObjectURL(file);
 try{ const r=await new C().decodeFromImageUrl(url); return r.getText?r.getText():r.text; } finally{ URL.revokeObjectURL(url); }
}
const canLiveScan=()=>STANDALONE&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
async function startLiveScan(){
 const v=$('#scan-video'); if(!v) return;
 try{
  if('BarcodeDetector' in window){
   SCAN_STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); v.srcObject=SCAN_STREAM; await v.play();
   const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
   const loop=async()=>{ if(!SCAN_STREAM) return; try{ const r=await det.detect(v); if(r[0]) return scanFound(r[0].rawValue); }catch(e){} requestAnimationFrame(loop); }; loop(); return;
  }
  const Z=await loadZX(); const C=zxReaderClass(Z); SCAN_READER=new C();
  SCAN_READER.decodeFromVideoDevice(undefined,v,(res)=>{ if(res) scanFound(res.getText?res.getText():res.text); });
 }catch(e){ const m=$('#scan-msg'); if(m) m.textContent='Kamera nicht verfügbar. Nutze „Foto aufnehmen“.'; }
}
function stopScan(){ try{SCAN_READER&&SCAN_READER.reset()}catch(e){} SCAN_READER=null; if(SCAN_STREAM){SCAN_STREAM.getTracks().forEach(t=>t.stop()); SCAN_STREAM=null;} }
function scanFound(code){ stopScan(); haptic(20); FS.cat='off'; FS.sel=null; FS.off={...offState(),q:String(code).replace(/\D/g,'')}; openSheet('food'); offSearch(); }

function haptic(ms=8){ try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){} }
function countUp(root){
 if(REDUCED) return;
 root.querySelectorAll('[data-count]').forEach(el=>{
  const to=+el.dataset.count, pre=el.dataset.prefix||'', suf=el.dataset.suffix||''; if(!isFinite(to)||to===0) return;
  const t0=performance.now(), dur=Math.min(1100,500+String(Math.round(to)).length*120);
  const step=t=>{const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,4); el.textContent=pre+fmt(to*e)+suf; if(k<1) requestAnimationFrame(step)};
  el.textContent=pre+'0'+suf; requestAnimationFrame(step);
 });
}
function animateEnter(root){
 root.querySelectorAll('.wrap.enter > *').forEach((el,i)=>el.style.setProperty('--i',Math.min(i,8)));
 root.querySelectorAll('.wrap.enter .grid, .wrap.enter .goal-list, .wrap.enter .rank-grid, .wrap.enter .lib').forEach(g=>[...g.children].forEach((c,j)=>c.style.setProperty('--j',Math.min(j,10))));
 countUp(root);
}

function libMatch(ex,f){
 if(f==='all') return true; if(f==='cardio') return ex.kind==='c'; if(f==='mob') return ex.kind==='t';
 if(GROUP_BY[f]) return PARENT[ex.prim]===f||ex.sec.some(m=>PARENT[m]===f);
 return ex.prim===f||ex.sec.includes(f);
}
const libPrimary=(ex,f)=>GROUP_BY[f]?PARENT[ex.prim]===f:ex.prim===f;
function libList(){
 const f=V.libSub||V.libM, q=norm(V.libQ);
 return Object.values(EX).filter(ex=>libMatch(ex,f)&&(!V.libEq||ex.eq===V.libEq)&&(!q||norm(ex.n).includes(q)||norm(MUSCLES[ex.prim]).includes(q)||norm(GROUP_BY[PARENT[ex.prim]].n).includes(q)||norm(EQ[ex.eq]).includes(q)))
  .sort((a,b)=>(libPrimary(a,f)?0:1)-(libPrimary(b,f)?0:1)||a.n.localeCompare(b.n,'de'));
}

/* ---- Fortschritt ---- */
function niceStep(x){ const e=Math.pow(10,Math.floor(Math.log10(x||1))); const f=x/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; }
function lineChart(pts,unit){
 if(pts.length<2) return `<div class="empty">Mindestens zwei Einträge nötig, dann erscheint hier deine Kurve.</div>`;
 const W=640,H=230,L=48,R=18,T=16,B=30;
 const xs=pts.map(p=>p.t), ys=pts.map(p=>p.y);
 let x0=Math.min(...xs), x1=Math.max(...xs); if(x1===x0) x1=x0+864e5;
 let lo=Math.min(...ys), hi=Math.max(...ys); const padv=(hi-lo)*.2||Math.max(1,hi*.05); lo-=padv; hi+=padv;
 const st=niceStep((hi-lo)/4); lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
 const X=t=>L+(t-x0)/(x1-x0)*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
 let g=''; for(let v=lo;v<=hi+1e-9;v+=st){ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(v,1)}</text>`; }
 const d=pts.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
 const area=d+` L${X(pts[pts.length-1].t).toFixed(1)} ${H-B} L${X(pts[0].t).toFixed(1)} ${H-B} Z`;
 const lab=t=>new Date(t).toLocaleDateString('de-DE',{day:'numeric',month:'short'});
 const last=pts[pts.length-1];
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">${g}<path d="${area}" fill="var(--accent)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.y)}" r="2.6" fill="var(--accent)"/>`).join('')}<circle cx="${X(last.t)}" cy="${Y(last.y)}" r="5.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${Math.min(X(last.t),W-R)}" y="${Math.max(Y(last.y)-12,T+10)}" text-anchor="end" font-size="13" font-weight="600" fill="var(--fg)">${fmt(last.y,1)} ${unit}</text><text x="${L}" y="${H-8}" font-size="12" fill="var(--muted)">${lab(x0)}</text><text x="${W-R}" y="${H-8}" text-anchor="end" font-size="12" fill="var(--muted)">${lab(x1)}</text></svg>`;
}
function renderProgress(){
 const used=[...new Set(S.workouts.flatMap(w=>w.items.map(i=>i.ex)))].filter(id=>EX[id]);
 if(!V.progEx||!used.includes(V.progEx)) V.progEx=used.find(id=>EX[id].comp)||used[0]||null;

const TOUR_STEPS=[

let TOUR=null;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?0:ms));
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
function startTour(){
 if(!S.profile||TOUR) return; closeSheet();
 TOUR={i:-1,busy:false,from:V.tab};
 let el=document.getElementById('tour'); if(!el){el=document.createElement('div');el.id='tour';document.body.appendChild(el)}
 el.innerHTML=`<div class="tour in center" role="dialog" aria-modal="true" aria-labelledby="tour-t"><div class="tour-spot"></div><div class="tour-card hide nomove" aria-live="polite"></div></div>`;
 const sp=el.querySelector('.tour-spot'); sp.style.transition='none'; sp.style.transform=`translate3d(${innerWidth/2}px,${innerHeight/2}px,0)`; sp.offsetWidth; sp.style.transition='';
 document.body.style.overflow='hidden'; document.body.classList.add('touring');

}
function tourTarget(st){ return st.c?null:(st.el()||null); }
function tourHTML(st,i,dir){
 const N=TOUR_STEPS.length, real=TOUR_STEPS.filter(x=>!x.c).length, k=TOUR_STEPS.slice(0,i+1).filter(x=>!x.c).length;
 const kPrev=Math.max(0,dir>0?k-1:k+1);
 const hero=st.c==='hello'?`<div class="tour-hero" aria-hidden="true"><div class="logo">${LOGO}</div><div class="tour-ladder">${[160,420,820,1450].map((sr,j)=>`<span style="--k:${j}">${emblem(sr,40)}</span>`).join('')}</div></div>`
  :st.c==='done'?`<div class="tour-hero tour-done" aria-hidden="true"><svg viewBox="0 0 72 72" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="36" r="30"/><path d="M24 37l8 8 16-17"/></svg></div>`:'';
 return `<div class="tour-body${dir<0?' back':''}">${hero}
  ${st.c?'':`<div class="tour-step">${k} von ${real}</div>`}
  <h2 id="tour-t">${esc(st.t)}</h2><p>${esc(st.b)}</p>
  ${st.c?'':`<div class="tour-prog" aria-hidden="true"><i style="--p0:${Math.min(kPrev,real)/real};--p1:${k/real}"></i></div>`}
  <div class="tour-actions">
   ${st.c==='done'?'':`<button class="skip" data-tour="skip">${st.c==='hello'?'Später':'Überspringen'}</button>`}
   ${i>0&&!st.c?`<button class="btn ghost" data-tour="back">Zurück</button>`:''}
   <button class="btn pri" data-tour="next">${st.c==='hello'?'Rundgang starten':st.c==='done'?"Los geht's":i===N-2?'Fertig':'Weiter'}</button>
  </div></div>`;
}
/* Sichtbarer Bereich für das Ziel: zwischen Bildschirmrand oben und Karte bzw. Tab-Leiste unten */
function tourLayout(t,ch){
 const iw=innerWidth, ih=innerHeight, mob=iw<=860;
 const nav=q1('.nav'), navTop=mob&&nav?nav.getBoundingClientRect().top:ih;
 const inNav=t&&t.closest('.side');
 return {iw,ih,mob,navTop,inNav,cardTop:mob?(inNav?16:navTop-ch-12):null};
}
async function showTourStep(i,dir){
 if(!TOUR||TOUR.busy) return;
 const N=TOUR_STEPS.length; if(i<0) return; if(i>=N) return endTour(true);
 TOUR.busy=true;
 const root=$('#tour .tour'), card=root.querySelector('.tour-card'), spot=root.querySelector('.tour-spot');
 let st=TOUR_STEPS[i];
 /* 1. Karte ausblenden */
 if(TOUR.i>=0){ card.classList.add('hide'); spot.classList.remove('ring'); await wait(180); }
 /* 2. Bereich wechseln: Seite blendet aus, Tab-Leiste wechselt, Seite blendet ein */
 if(st.tab&&V.tab!==st.tab){
  document.body.classList.add('tour-swap'); await wait(220);
  V.tab=st.tab; LAST_TAB=st.tab; render(); window.scrollTo(0,0);
  await nextFrame(); document.body.classList.remove('tour-swap');
 }
 document.body.classList.toggle('tour-nav',!st.c);
 if(!st.c&&!tourTarget(st)){ TOUR.busy=false; return showTourStep(i+dir,dir); }
 TOUR.i=i; haptic(5);
 root.classList.toggle('center',!!st.c);
 /* 3. Inhalt setzen (noch unsichtbar) und Höhe messen */
 card.innerHTML=tourHTML(st,i,dir);
 const ch=card.offsetHeight, cw=card.offsetWidth;
 const t=tourTarget(st), L=tourLayout(t,ch);
 /* 4. Ziel an seine Endposition scrollen, ohne Zwischenstopps */
 let rect=t?t.getBoundingClientRect():null;
 if(t&&!L.inNav){
  const tb=q1('.topbar'), areaTop=L.mob?Math.max(24,(tb?tb.offsetHeight:0)+6):24, areaBot=L.mob?L.cardTop-12:L.ih-24;
  const room=areaBot-areaTop, h=rect.height+16;
  let want=h<=room?areaTop+8+(room-h)/2:areaTop+8;
  if(!L.mob) want=Math.max(80,(L.ih-rect.height)/2-(rect.height+ch+40<L.ih?ch/2:0));
  const maxScroll=document.documentElement.scrollHeight-L.ih;
  const to=Math.max(0,Math.min(maxScroll,scrollY+rect.top-want));
  const dy=to-scrollY;
  if(Math.abs(dy)>1){ window.scrollTo({top:to,behavior:REDUCED?'auto':'smooth'}); rect=new DOMRect(rect.x,rect.y-dy,rect.width,rect.height); }
 }
 /* 5. Lichtkegel und Karte in einer Bewegung zum Ziel */
 placeSpot(spot,rect,L);
 placeCard(card,rect,L,ch,cw,!!st.c);
 await wait(140);
 card.classList.remove('hide','nomove');
 if(t) setTimeout(()=>spot.classList.add('ring'),REDUCED?0:700);
 setTimeout(()=>card.querySelector('[data-tour=next]')?.focus({preventScroll:true}),REDUCED?0:400);
 await wait(380); TOUR.busy=false;
}
function placeSpot(spot,r,L){
 if(!r){ spot.style.transform=`translate3d(${L.iw/2}px,${L.ih/2}px,0)`; spot.style.width='0px'; spot.style.height='0px'; return; }
 const pad=Math.min(r.width,r.height)<60?12:8;
 let top=Math.max(8,r.top-pad), bot=Math.min(L.ih-8,r.bottom+pad);
 if(L.mob&&!L.inNav){ bot=Math.min(bot,L.cardTop-10); const tb=q1('.topbar'); if(tb) top=Math.max(top,tb.offsetHeight-4); }
 const left=Math.max(6,r.left-pad), right=Math.min(L.iw-6,r.right+pad);
 spot.style.transform=`translate3d(${left}px,${top}px,0)`;
 spot.style.width=Math.max(0,right-left)+'px'; spot.style.height=Math.max(0,bot-top)+'px';

function placeCard(card,r,L,ch,cw,center){

 else if(L.mob){ x=12; y=L.cardTop; }
 else{
  const top=r.top-8, bot=r.bottom+8, left=r.left-8, right=r.right+8;
  x=Math.min(Math.max(16,left),L.iw-cw-16);
  if(right+20+cw<L.iw-16&&L.inNav){ x=right+20; y=Math.min(Math.max(16,top),L.ih-ch-16); }

  else { x=L.iw-cw-24; y=L.ih-ch-24; }
 }
 /* Karte wird unsichtbar umgesetzt und dann eingeblendet */
